<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,user-scalable=no">
<meta name="theme-color" content="#1f1812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="광부일기">
<title>광부일기</title>
<style>
:root{
  --panel:rgba(30,22,15,.86); --line:rgba(255,230,190,.16);
  --text:#f6ecdd; --dim:#c9b79e; --accent:#e9b04f;
  --copper:#d97a3a; --iron:#c3cbd5; --crystal:#7fdcef; --moon:#efe9ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120d09;color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;top:0;left:0;display:block}
/* 컴퓨터처럼 넓은 화면은 글과 창도 조금 작게 */
@media (min-width:700px){ #hud,#panel,#modal .sheet,#toasts{zoom:.85} }

/* 위쪽 정보 */
#hud{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:5;
  padding:calc(8px + env(safe-area-inset-top)) 12px 18px;pointer-events:none;
  background:linear-gradient(rgba(10,7,4,.55),rgba(10,7,4,0))}
.hud-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{background:rgba(25,18,12,.72);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap;backdrop-filter:blur(4px)}
.chip.gold{margin-left:auto;color:var(--accent);font-weight:700}
.chip.until{color:var(--dim);font-size:13px}
.ebar{position:relative;height:10px;margin-top:8px;background:rgba(25,18,12,.72);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ebar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d9b44a,#f5da84);transition:width .25s}
.ebar .mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.5)}
.ebar-label{font-size:12px;color:var(--dim);margin-top:3px;text-shadow:0 1px 2px #000}

/* 아래쪽 판 */
#panel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:5;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.goal{font-size:14px}
.goal .bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:6px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent)}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:28px;align-items:center}
.inv .chip{display:flex;align-items:center;gap:6px}
.empty{color:var(--dim);font-size:13px}
.note{color:var(--dim);font-size:12px;margin:6px 0 0}
.row{display:flex;align-items:center;gap:8px}
.row b{font-size:16px}
.btn{background:rgba(70,54,38,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2b1d0c;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.right{margin-left:auto}

.ore{display:inline-block;width:12px;height:12px;border-radius:3px;transform:rotate(45deg);flex:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.ore.copper{background:var(--copper)} .ore.iron{background:var(--iron)}
.ore.crystal{background:var(--crystal)} .ore.moon{background:var(--moon);box-shadow:0 0 6px #b9a8ff}

/* 창 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#modal[hidden]{display:none}
.sheet{background:#2e241b;border:1px solid var(--line);border-radius:16px;width:100%;max-width:456px;padding:16px;max-height:85vh;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.sheet h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet p{margin:6px 0;line-height:1.55;font-size:15px}
.sheet .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:flex-end}
.sell{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sell .nm{flex:1;display:flex;align-items:center;gap:8px;font-size:15px}
.sell .nm small{color:var(--dim)}
.floors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}

/* 알림 */
#toasts{position:fixed;left:0;right:0;top:96px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,15,10,.9);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;animation:tin .2s,tout .3s 1.9s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@keyframes tout{to{opacity:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<header id="hud"></header>
<div id="panel"></div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script>
'use strict';

/* ===== 설정 ===== */
const KEY = 'minerdiary.v1';
const MAX_ENERGY = 100;
const DIG_COST = 2;
const W = 7, H = 7;
const MAX_FLOOR = 5;
const FAINT_LOSS = 0.3;              // 쓰러지면 그날 얻은 광석 중 잃는 비율 (1단계 임시값)
const START_FRAC = { normal: 1, late: 0.9, faint: 0.7 };

const ORES = {
  copper:  { name: '구리 광석', price: 10,  color: '#d97a3a', light: '#ffb27a' },
  iron:    { name: '철 광석',   price: 25,  color: '#aeb7c2', light: '#eef2f6' },
  crystal: { name: '수정 원석', price: 60,  color: '#5fc9e0', light: '#c9f6ff' },
  moon:    { name: '월광석',    price: 150, color: '#d8cfff', light: '#ffffff' },
};
const ORE_ORDER = ['copper', 'iron', 'crystal', 'moon'];
const FLOOR_ORES = {
  1: [['copper', 1]],
  2: [['copper', .8], ['iron', .2]],
  3: [['copper', .5], ['iron', .5]],
  4: [['copper', .35], ['iron', .5], ['crystal', .15]],
  5: [['copper', .25], ['iron', .5], ['crystal', .25]],
};
// 층마다 바위 색 (깊을수록 어둡고 차가움)
const FLOOR_ROCK = { 1: [138, 104, 72], 2: [134, 90, 70], 3: [116, 104, 90], 4: [92, 100, 112], 5: [88, 78, 104] };
// 시간대: 오늘 깨어난 뒤 쓴 기력(최대 기력 대비 %)이 at 이상이면 그 시간대
const PHASES = [
  { name: '아침', icon: '🌅', at: 0 },
  { name: '점심', icon: '☀️', at: 30 },
  { name: '저녁', icon: '🌇', at: 60 },
  { name: '새벽', icon: '🌙', at: 90 },
];
// 시간대별 하늘과 풍경 색
const SKY = [
  { top: '#8cbfe9', bot: '#f8d9ae', far: '#9db1cc', far2: '#b9c6d8', hill: '#78a26c', hill2: '#5d8a58', tint: 'rgba(255,180,110,0.07)', sun: [0.2, 0.3], sunC: '#fff2c8' },
  { top: '#4c97df', bot: '#c4e5ff', far: '#93abc9', far2: '#b3c6dc', hill: '#6aa660', hill2: '#4f8e4c', tint: null, sun: [0.55, 0.11], sunC: '#fffbea' },
  { top: '#3a3c78', bot: '#f29262', far: '#6e5d8a', far2: '#8f6f8f', hill: '#566a4e', hill2: '#43573e', tint: 'rgba(255,110,50,0.13)', sun: [0.84, 0.33], sunC: '#ffb072' },
  { top: '#060a24', bot: '#252957', far: '#262b52', far2: '#323866', hill: '#1d2b33', hill2: '#16222a', tint: 'rgba(8,12,45,0.42)', moon: [0.74, 0.14] },
];
const GOAL = { id: 'smithy', name: '대장간', cost: 500 };
const RUINS = {
  smithy:  { name: '부서진 대장간', icon: '⚒️', sign: '고치면 제련과 곡괭이 강화' },
  market:  { name: '빈 시장 터', icon: '🏪', sign: '고치면 매일 바뀌는 시세' },
  kitchen: { name: '닫힌 식당', icon: '🍲', sign: '고치면 요리와 주민 의뢰' },
  jewel:   { name: '부서진 세공소', icon: '💍', sign: '고치면 보석 세공' },
  museum:  { name: '무너진 박물관', icon: '🏛️', sign: '고치면 도감과 기증' },
  gate:    { name: '닫힌 성벽 문', icon: '🏰', sign: '고치면 사냥' },
  bridge:  { name: '무너진 강가 다리', icon: '🌉', sign: '고치면 낚시' },
  field:   { name: '거친 밭', icon: '🌱', sign: '일구면 농사' },
  forest:  { name: '막힌 숲길', icon: '🌲', sign: '치우면 채집' },
};
// 마을 안 자리 (x는 건물 가운데, 단위는 화면 px)
const SPOTS = [
  { id: 'house',    x: 78,   w: 104, name: '낡은 집',     act: 'house' },
  { id: 'mine',     x: 222,  w: 120, name: '광산',        act: 'entrance' },
  { id: 'merchant', x: 352,  w: 104, name: '떠돌이 상인', act: 'merchant' },
  { id: 'chief',    x: 478,  w: 84,  name: '촌장',        act: 'chief' },
  { id: 'smithy',   x: 640,  w: 120 }, { id: 'market', x: 810, w: 120 },
  { id: 'kitchen',  x: 975,  w: 110 }, { id: 'jewel',  x: 1130, w: 96 },
  { id: 'museum',   x: 1300, w: 140 }, { id: 'gate',   x: 1490, w: 140 },
  { id: 'bridge',   x: 1690, w: 150 }, { id: 'field',  x: 1880, w: 130 },
  { id: 'forest',   x: 2060, w: 130 },
];
SPOTS.forEach(s => { if (RUINS[s.id]) { s.ruin = true; s.name = RUINS[s.id].name; s.act = 'ruin'; } });
const WORLD = 2180;

// 주민 대사는 자연스러운 말투 (화면 안내 글만 간결체)
const INTRO = [
  '어서 와요. 광부들이 다 떠나고 나서 마을이 이렇게 무너져 버렸어요.',
  '남은 건 저 광산이랑, 가끔 들르는 떠돌이 상인뿐이에요.',
  '광산은 위에서부터 차례로 파 내려가면 돼요. 판 자리에 나오는 숫자는 주변 여덟 칸에 남은 광석 수예요.',
  '같은 광석이 붙어 있으면 한 번에 캘 수 있어요. 길게 이어질수록 덤도 붙고요.',
  '캔 광석은 상인한테 팔아서 돈을 모아 줘요. 대장간부터 고치면 좋겠어요.',
  '일을 하다 보면 해가 기울어요. 지치면 집에 가서 푹 자고요.',
];
const CHIEF_TIPS = [
  '숫자가 큰 칸 옆을 파 봐요. 광석이 나올 가능성이 높거든요.',
  '0이 나온 칸 주변엔 광석이 없어요. 다른 쪽을 파 보는 게 좋아요.',
  '계단을 찾으면 더 깊이 내려갈 수 있어요. 깊을수록 비싼 광석이 나와요.',
  '새벽에 내려간 층에선 가끔 월광석이 보인대요.',
  '새벽까지 무리하면 다음 날 몸이 덜 풀릴 거예요.',
  '기력이 바닥나면 쓰러져요. 그날 캔 것도 조금 잃어버리고요.',
];

/* ===== 상태 ===== */
let S;
function freshState() {
  return {
    v: 1, day: 1, max: MAX_ENERGY, energy: MAX_ENERGY, minE: MAX_ENERGY, dayStart: MAX_ENERGY,
    gold: 0, inv: {}, today: {}, deepest: 1,
    screen: 'village', mine: null, introSeen: false, chiefDay: 0,
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.v === 1) return Object.assign(freshState(), d);
    }
  } catch (e) { /* 저장소를 못 쓰면 새로 시작 */ }
  return freshState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ }
}

/* ===== 시간 ===== */
function usedPct() { return (S.dayStart - S.minE) * 100 / S.max; }
function phaseIndex() {
  const u = usedPct();
  let idx = 0;
  PHASES.forEach((p, i) => { if (u >= p.at) idx = i; });
  return idx;
}
function untilNext() {
  const i = phaseIndex();
  const next = PHASES[i + 1];
  if (next) {
    const left = Math.max(0, Math.ceil(S.minE - (S.dayStart - S.max * next.at / 100)));
    if (left < S.minE) return { name: next.name, left };
  }
  return { name: '쓰러짐', left: S.minE };
}
function spend(n) {
  const before = phaseIndex();
  S.energy = Math.max(0, S.energy - n);
  S.minE = Math.min(S.minE, S.energy);
  const after = phaseIndex();
  if (S.energy <= 0) { faint(); return false; }
  if (after !== before) {
    const p = PHASES[after];
    toast(after === 3 ? `${p.icon} 새벽이라 새로 내려간 층에 희귀 광석` : `${p.icon} ${p.name}`);
  }
  return true;
}

/* ===== 하루 ===== */
function addItem(o, n) {
  S.inv[o] = (S.inv[o] || 0) + n;
  S.today[o] = (S.today[o] || 0) + n;
}
function newDay(kind) {
  S.day += 1;
  S.energy = Math.round(S.max * START_FRAC[kind]);
  S.minE = S.energy;
  S.dayStart = S.energy;
  S.today = {};
  S.mine = null;
  S.screen = 'village';
  hero.x = hero.tx = SPOTS[0].x + 40; hero.target = null;
  fade = 1;
}
function sleep() {
  const kind = phaseIndex() === 3 ? 'late' : 'normal';
  newDay(kind);
  save(); render();
  modal({
    title: `🌅 ${S.day}일차 아침`,
    body: `<p>기력 ⚡${S.energy}</p>` + (kind === 'late' ? '<p class="note">새벽까지 깨어 있던 탓에 기력이 조금 덜 참</p>' : ''),
    buttons: [{ label: '확인', act: 'close', primary: true }],
  });
}
function faint() {
  const lost = {};
  for (const o of Object.keys(S.today)) {
    const n = Math.min(Math.floor(S.today[o] * FAINT_LOSS), S.inv[o] || 0);
    if (n > 0) { S.inv[o] -= n; lost[o] = n; }
  }
  newDay('faint');
  save(); render();
  const lostHtml = Object.keys(lost).length
    ? '<p>잃은 것: ' + ORE_ORDER.filter(o => lost[o]).map(o => `${ORES[o].name} ${lost[o]}`).join(', ') + '</p>'
    : '<p>잃은 것 없음</p>';
  modal({
    title: '😵 쓰러짐',
    body: `<p>집에서 깨어나니 ${S.day}일차 아침</p>${lostHtml}<p>기력 ⚡${S.energy}</p><p class="note">쓰러진 다음 날은 기력이 덜 참</p>`,
    buttons: [{ label: '확인', act: 'close', primary: true }],
  });
}

/* ===== 광산 규칙 ===== */
function rnd(n) { return Math.floor(Math.random() * n); }
function pickOre(floor) {
  const list = FLOOR_ORES[floor];
  let r = Math.random(), acc = 0;
  for (const [o, w] of list) { acc += w; if (r < acc) return o; }
  return list[list.length - 1][0];
}
function orth(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  if (x > 0) out.push(i - 1);
  if (x < W - 1) out.push(i + 1);
  if (y > 0) out.push(i - W);
  if (y < H - 1) out.push(i + W);
  return out;
}
function around(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) out.push(ny * W + nx);
  }
  return out;
}
function genBoard(floor, dawn) {
  const t = Array.from({ length: W * H }, () => ({ t: 's', open: false }));
  const bottom = floor === MAX_FLOOR ? H - 1 : H;   // 5층 맨 아래 줄은 단단한 바위
  if (floor === MAX_FLOOR) for (let x = 0; x < W; x++) t[(H - 1) * W + x].t = 'h';
  const stoneAt = minRow => {
    const c = [];
    for (let i = 0; i < W * H; i++) if (t[i].t === 's' && ((i / W) | 0) >= minRow && ((i / W) | 0) < bottom) c.push(i);
    return c.length ? c[rnd(c.length)] : -1;
  };
  const clusters = 3 + Math.floor(floor / 2);
  for (let k = 0; k < clusters; k++) {
    const o = pickOre(floor);
    const size = 1 + rnd(4);
    const seed = stoneAt(1);
    if (seed < 0) break;
    t[seed] = { t: 'o', o, open: false };
    const vein = [seed];
    while (vein.length < size) {
      const cand = [];
      vein.forEach(i => orth(i).forEach(j => { if (t[j].t === 's' && ((j / W) | 0) < bottom) cand.push(j); }));
      if (!cand.length) break;
      const j = cand[rnd(cand.length)];
      t[j] = { t: 'o', o, open: false };
      vein.push(j);
    }
  }
  if (dawn) {
    const n = floor >= 4 ? 2 : 1;
    for (let k = 0; k < n; k++) { const i = stoneAt(2); if (i >= 0) t[i] = { t: 'o', o: 'moon', open: false }; }
  }
  if (floor < MAX_FLOOR) { const i = stoneAt(3); if (i >= 0) t[i].t = 'x'; }
  return { floor, tiles: t, pos: -1, seed: rnd(100000) };
}
function canDig(i) {
  const tl = S.mine.tiles[i];
  if (tl.open || tl.t === 'h') return false;
  if (i < W) return true;
  return orth(i).some(j => S.mine.tiles[j].open);
}
function hint(i) {
  return around(i).filter(j => S.mine.tiles[j].t === 'o' && !S.mine.tiles[j].open).length;
}
function enterMine(floor) {
  S.mine = genBoard(floor, phaseIndex() === 3);
  S.screen = 'mine';
  miner.x = miner.y = null;
  closeModal();
  save(); render();
  fade = 0.6;
  if (floor === MAX_FLOOR) toast('🪨 더 아래는 단단한 바위');
}
function dig(i) {
  const tl = S.mine.tiles[i];
  if (tl.t === 'h') { toast('🪨 단단한 바위라 곡괭이 강화 필요'); bump(i); return; }
  if (tl.open) { if (tl.t === 'x') descend(); else S.mine.pos = i; return; }
  if (!canDig(i)) { toast('위쪽에서 이어진 칸부터 캐기'); bump(i); return; }
  const c = tileCenter(i);
  if (tl.t === 'o') {
    const o = tl.o, vein = [i], seen = new Set([i]);
    for (let k = 0; k < vein.length; k++) {
      orth(vein[k]).forEach(j => {
        const q = S.mine.tiles[j];
        if (!seen.has(j) && q.t === 'o' && q.o === o && !q.open) { seen.add(j); vein.push(j); }
      });
    }
    const n = vein.length;
    const bonus = n >= 3 ? n - 2 : 0;
    vein.forEach(j => { S.mine.tiles[j] = { t: 's', open: true }; const cj = tileCenter(j); burst(cj.x, cj.y, ORES[o].color, ORES[o].light, 14); });
    addItem(o, n + bonus);

/* ===== 그림: 공통 ===== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = 'system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
// Z: 그림 배율. 넓은 화면(컴퓨터)에서는 줄여서 더 넓게 보이게 함. VW, VH는 배율을 뺀 그림 좌표 크기
let VW = 0, VH = 0, Z = 1, DPR = 1, hudH = 90, panelH = 120;

const miner = { x: null, y: null };

function resize() {

}
function clampCam(x) { return Math.max(0, Math.min(Math.max(0, WORLD - VW), x)); }

  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

}
// 입체 상자: 앞면, 오른쪽 옆면, 윗면 (x,y는 앞면 왼쪽 아래)
const DX = 0.6, DY = -0.42;
function box(x, y, w, h, d, front, side, top) {
  const ox = d * DX, oy = d * DY;
  poly([[x + w, y], [x + w + ox, y + oy], [x + w + ox, y - h + oy], [x + w, y - h]], side);
  poly([[x, y - h], [x + ox, y - h + oy], [x + w + ox, y - h + oy], [x + w, y - h]], top);
  rect(x, y - h, w, h, front);
}
// 박공지붕: 앞쪽 삼각형과 오른쪽 경사면 (y는 지붕이 얹히는 앞면 위쪽)

// 사람: y는 발 위치, s는 크기 (1이면 키 약 40px)
function person(x, y, s, o) {

    rect(-8.5, -36.5, 18, 2.5, '#d9a71e');

  if (o.hat) { rect(-9, -40, 18, 3, o.hat); rrect(-5.5, -46, 11, 7, 2, o.hat); }
  if (o.hair) { ctx.beginPath(); ctx.arc(0, -36, 6.8, Math.PI * 1.05, Math.PI * 1.95); ctx.fillStyle = o.hair; ctx.fill(); }
  ctx.restore();
}

/* ===== 그림: 마을 ===== */
function groundY() { return Math.round(Math.min(VH * 0.62, VH - panelH - 70)); }
function spot(id) { return SPOTS.find(s => s.id === id); }
function skyBand(y0, y1, sk) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);

  rect(0, y0, VW, y1 - y0, g);
}
function ridge(par, base, amp, f1, f2, color, seed) {
  const off = camX * par;
  ctx.beginPath(); ctx.moveTo(0, VH);
  for (let x = 0; x <= VW + 8; x += 8) {
    const wx = x + off + seed;
    const y = base - amp * (0.55 + 0.3 * Math.sin(wx * f1) + 0.15 * Math.sin(wx * f2 + 1.7));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(VW, VH); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}
function drawSky(gy, sk, ph) {
  skyBand(0, gy, sk);
  if (sk.sun) {
    const sx = sk.sun[0] * VW, sy = sk.sun[1] * gy + hudH * 0.4;
    const g = ctx.createRadialGradient(sx, sy, 4, sx, sy, 70);
    g.addColorStop(0, sk.sunC); g.addColorStop(0.25, sk.sunC); g.addColorStop(1, 'rgba(255,240,200,0)');
    circle(sx, sy, 70, g);
  }
  if (sk.moon) {
    for (let i = 0; i < 70; i++) {
      const tw = 0.5 + 0.5 * Math.sin(now / 600 + i * 1.7);
      circle(hash(i * 7 + 1) * VW, hash(i * 13 + 5) * gy * 0.8, hash(i) < 0.15 ? 1.6 : 0.9, `rgba(255,255,240,${0.35 + 0.6 * tw})`);
    }
    const mx = sk.moon[0] * VW, my = sk.moon[1] * gy + hudH * 0.4;
    circle(mx, my, 26, 'rgba(230,230,255,.12)');
    circle(mx, my, 15, '#f4f1dc');
    circle(mx + 6, my - 4, 13, sk.top);
  }
  // 구름
  for (let i = 0; i < 6; i++) {
    const span = VW + 260;
    const x = ((hash(i * 31) * span + now * 0.008 * (0.6 + hash(i))) - camX * 0.08) % span;
    const cx = (x + span) % span - 130, cy = hudH + 20 + hash(i * 17) * gy * 0.28;
    const a = ph === 3 ? 0.18 : ph === 2 ? 0.55 : 0.75;
    const c = ph === 2 ? `rgba(255,205,180,${a})` : `rgba(255,255,255,${a})`;

  const off = camX * 0.45;
  for (let k = Math.floor(off / 26) - 1; k < (off + VW) / 26 + 1; k++) {
    if (hash(k * 3 + 11) < 0.45) continue;
    const wx = k * 26 + 50;

    const y = gy - 26 - 44 * (0.55 + 0.3 * Math.sin(wx * 0.012) + 0.15 * Math.sin(wx * 0.031 + 1.7)) + 6;
    const h = 16 + hash(k) * 16;

}
function drawGround(gy, ph) {

  g.addColorStop(0, grass[0]); g.addColorStop(1, grass[1]);

  const layers = [[0, 10, '#6b4a2c'], [10, 46, '#5b3e27'], [46, 110, '#4a3220'], [110, 400, '#3b2819'], [400, 2000, '#2d1f14']];

      line(x + cs * 0.2, y + cs * 0.8, x + cs * 0.75, y + cs * 0.25, 'rgba(255,255,255,.1)', 3);
    } else if (tl.open) {
      hollow(x, y, cs, col);
      if (tl.t === 'x') {
        rrect(x + cs * 0.18, y + cs * 0.28, cs * 0.64, cs * 0.62, 6, '#070403');
        line(x + cs * 0.32, y + cs * 0.25, x + cs * 0.32, y + cs * 0.95, '#a8763f', 3);
        line(x + cs * 0.68, y + cs * 0.25, x + cs * 0.68, y + cs * 0.95, '#a8763f', 3);
        for (let k = 0; k < 4; k++) line(x + cs * 0.32, y + cs * (0.38 + k * 0.15), x + cs * 0.68, y + cs * (0.38 + k * 0.15), '#a8763f', 2.5);
      }
    } else {
      rockBlock(x, y, cs, col, i * 97 + m.seed, false);
    }
  });
  // 광부 (마지막으로 판 칸에 섬)
  const target = m.pos >= 0 ? tileCenter(m.pos) : { x: bx + cs * 1.5, y: ty + cs / 2 };
  const tx = target.x, tyy = target.y + cs / 2 - 3;
  if (miner.x === null) { miner.x = tx; miner.y = tyy; }
  miner.x += (tx - miner.x) * Math.min(1, dt * 14);
  miner.y += (tyy - miner.y) * Math.min(1, dt * 14);
  swing = Math.max(0, swing - dt * 4);
  person(miner.x, miner.y, cs / 46, { shirt: '#3d6fa8', pants: '#2c3b55', helmet: true, pick: swing > 0 ? Math.sin(swing * Math.PI) : 0.15, face: 1 });
  // 어둠: 광부 둘레만 밝음
  const dark = 0.42 + m.floor * 0.06;
  const g = ctx.createRadialGradient(miner.x, miner.y - cs * 0.4, cs * 0.6, miner.x, miner.y - cs * 0.4, cs * 4.6);
  g.addColorStop(0, 'rgba(255,200,120,.06)'); g.addColorStop(0.35, `rgba(0,0,0,${dark * 0.35})`); g.addColorStop(1, `rgba(0,0,0,${dark})`);
  rect(0, Math.max(surface, -1), VW, VH, g);
  const lg = ctx.createRadialGradient(lanX, ty + cs * 0.4, 2, lanX, ty + cs * 0.4, cs * 1.4);
  lg.addColorStop(0, 'rgba(255,200,110,.35)'); lg.addColorStop(1, 'rgba(255,200,110,0)');
  circle(lanX, ty + cs * 0.4, cs * 1.4, lg);
  // 어둠 위에 그리는 것: 캘 수 있는 칸 테두리, 힌트 숫자, 계단 빛
  const pulse = 0.55 + 0.25 * Math.sin(now / 400);
  ctx.lineWidth = 2;
  m.tiles.forEach((tl, i) => {
    const x = bx + (i % W) * cs, y = by + ((i / W) | 0) * cs;
    if (!tl.open && canDig(i)) {
      rrect(x + 2.5, y + 2.5, cs - 5, cs - 5, 5, null, `rgba(255,214,140,${pulse})`);
    } else if (tl.open && tl.t === 'x') {
      rrect(x + 2, y + 2, cs - 4, cs - 4, 6, `rgba(255,200,90,${0.12 + 0.1 * Math.sin(now / 300)})`, '#e9b04f');
    } else if (tl.open) {
      const n = hint(i);
      if (n) {
        ctx.font = `800 ${Math.round(cs * 0.46)}px ${FONT}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
        ctx.strokeText(n, x + cs / 2, y + cs / 2 + 1);
        ctx.fillStyle = ['', '#9fd3ff', '#a7e39a', '#ffd27a', '#ffa36b', '#ff7d7d', '#ff7d7d', '#ff7d7d', '#ff7d7d'][n];
        ctx.fillText(n, x + cs / 2, y + cs / 2 + 1);
        ctx.lineWidth = 2;
      }
    }
  });
  bumps = bumps.filter(b => (b.t -= dt) > 0);
  bumps.forEach(b => {
    const x = bx + (b.i % W) * cs, y = by + ((b.i / W) | 0) * cs;
    rrect(x + 2, y + 2, cs - 4, cs - 4, 5, `rgba(224,90,70,${b.t * 1.5})`);
  });
  label(bx + cs * W / 2, ty + cs / 2, `광산 ${m.floor}층`, true);
}
function bump(i) { bumps.push({ i, t: 0.35 }); }

/* ===== 효과 ===== */
function burst(x, y, c1, c2, n) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6 + Math.random() * 0.4, s: 2 + Math.random() * 3, c: k % 3 ? c1 : c2 });
  }
}
function floatText(x, y, text, color) { floats.push({ x, y, text, color, life: 1 }); }
function drawEffects(dt) {
  parts = parts.filter(p => (p.life -= dt) > 0);
  parts.forEach(p => {
    p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    rect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s, p.c);
  });
  ctx.globalAlpha = 1;
  floats = floats.filter(f => (f.life -= dt) > 0);
  floats.forEach(f => {
    f.y -= 40 * dt;
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `800 20px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

/* ===== 그리기 반복 ===== */
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t; now = t;
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (S.screen === 'mine' && S.mine) drawMine(dt); else drawVillage(dt);
  drawEffects(dt);
  if (fade > 0) { rect(0, 0, VW, VH, `rgba(0,0,0,${Math.min(1, fade)})`); fade = Math.max(0, fade - dt * 1.4); }
  requestAnimationFrame(frame);
}

/* ===== 입력 ===== */
function walkTo(s) {
  const tx = Math.max(20, Math.min(WORLD - 20, s.x + (s.x > hero.x ? -s.w / 2 - 10 : s.w / 2 + 10)));
  if (Math.abs(hero.x - tx) < 4 || Math.abs(hero.x - s.x) < s.w / 2) { hero.target = null; hero.tx = hero.x; ACTS[s.act](s.id); return; }
  hero.tx = tx; hero.target = s;
}
function tapAt(x, y) {
  if (S.screen === 'mine' && S.mine) {
    const { cs, bx, by } = mineGeo();
    const c = Math.floor((x - bx) / cs), r = Math.floor((y - by) / cs);
    if (c >= 0 && c < W && r >= 0 && r < H) dig(r * W + c);
    return;
  }
  const gy = groundY(), wx = x + camX;
  if (y < gy - 190 || y > gy + 34) return;
  const s = SPOTS.find(p => Math.abs(wx - p.x) <= p.w / 2 + 12);
  if (s) walkTo(s);
}
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cam: camX, moved: false }; });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 8 || Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.moved && S.screen === 'village') camX = clampCam(drag.cam - dx / Z);
});
cv.addEventListener('pointerup', e => {
  if (drag && !drag.moved && document.getElementById('modal').hidden) tapAt(e.clientX / Z, e.clientY / Z);
  drag = null;
});
cv.addEventListener('pointercancel', () => { drag = null; });

const ACTS = {
  close: closeModal,
  none: () => {},
  intro: (a) => showIntro(+a),
  introDone: () => { S.introSeen = true; S.chiefDay = S.day; save(); closeModal(); render(); },
  chief: openChief,
  merchant: openMerchant,
  house: openHouse,
  entrance: openEntrance,
  ruin: (a) => openRuin(a),
  enter: (a) => enterMine(+a),
  descend,
  leave: leaveMine,
  sleep: () => { closeModal(); sleep(); },
  sellAll,
  resetAsk: () => modal({ title: '처음부터', body: '<p>모든 기록 삭제</p>', buttons: [{ label: '취소', act: 'close' }, { label: '삭제', act: 'reset', primary: true }] }),
  reset: () => { S = freshState(); hero.x = hero.tx = 140; camX = 0; save(); closeModal(); render(); showIntro(0); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'sell') { sell(b.dataset.o, +b.dataset.n); return; }
  const f = ACTS[b.dataset.act];
  if (f) f(b.dataset.arg);
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
window.addEventListener('resize', resize);

/* ===== 시작 ===== */
S = load();
render();
resize();
requestAnimationFrame(frame);
if (!S.introSeen) showIntro(0);
// 테스트용 창구: 상태 읽기와 칸, 건물의 화면 위치
window.MinerDiary = {
  state: () => S, hint, canDig, phaseIndex, untilNext,
  tilePoint: i => { const c = tileCenter(i); return { x: c.x * Z, y: c.y * Z }; },
  spotPoint: id => { const s = spot(id); camX = clampCam(s.x - VW / 2); return { x: (s.x - camX) * Z, y: (groundY() - 40) * Z }; },
};
</script>
