<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f1812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="광부일기">
<title>광부일기</title>
<style>
:root{
  --wood:#33251a; --wood2:#261b12; --edge:#6b4f36; --hi:rgba(255,235,200,.14);
  --fg:#f8eedd; --dim:#cdb99c; --accent:#f0b64f; --accent2:#d9952c; --ink:#2b1d0c; --bad:#ef7a62;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --sl:max(10px,env(safe-area-inset-left,0px)); --sr:max(10px,env(safe-area-inset-right,0px));
  --st:calc(8px + env(safe-area-inset-top,0px)); --sb:calc(10px + env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120d09;color:var(--fg);overflow:hidden}
body{font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 나무판 느낌의 공통 판 */
.plate{background:linear-gradient(var(--wood),var(--wood2));border:2px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.3)}

/* 위쪽 정보 */
.hud{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:6px;max-width:620px;margin:0 auto;padding:var(--st) var(--sr) 0 var(--sl);pointer-events:none}
.hud{flex-wrap:wrap}
.hud>*{pointer-events:auto}
.qrow{flex-basis:100%;display:flex;pointer-events:none}
.quest{pointer-events:auto;height:34px;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;position:relative;overflow:hidden;max-width:100%;white-space:nowrap;border-color:#a8792c}
.quest em{font-style:normal;font-size:11px;color:var(--ink);background:var(--accent);border-radius:8px;padding:1px 6px}
.quest span{color:var(--accent)}
.quest i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
.quest.done{color:var(--dim);border-color:var(--edge)}
.quest:active{transform:translateY(2px)}
.pill{height:34px;border-radius:17px;padding:0 12px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px;white-space:nowrap}
.pill.gold{color:var(--accent)}
.pill.icon{width:34px;padding:0;justify-content:center;font-size:16px}
.energy{flex:1;min-width:0;height:34px;border-radius:17px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.energy .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(#f7d877,#e2a93a);transition:width .25s;opacity:.92}
.energy.low .fill{background:linear-gradient(#f29a7a,#d9583c)}
.energy .mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(40,25,10,.45)}
.energy b,.energy small{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.75);white-space:nowrap}
.energy b{font-size:14px}
.energy small{font-size:12px;color:#fff5df}

/* 마을 아래쪽 단추 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;max-width:620px;margin:0 auto;padding:0 var(--sr) var(--sb) var(--sl);pointer-events:none}
.dock>*{pointer-events:auto}
.goal{height:44px;border-radius:14px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;position:relative;overflow:hidden}
.goal i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.goal span{color:var(--accent)}
.bag{height:44px;min-width:44px;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:700}
.dock button:active,.pill.icon:active{transform:translateY(2px)}

/* 광산 아래쪽 막대 */
.minebar{position:fixed;left:0;right:0;bottom:0;z-index:3;height:calc(64px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;max-width:620px;margin:0 auto;padding:0 var(--sr) env(safe-area-inset-bottom,0px) var(--sl);border-radius:18px 18px 0 0;border-bottom:0}
.minebar b{font-size:15px;white-space:nowrap}
.minebar .got{flex:1;min-width:0;display:flex;gap:10px;overflow:hidden;white-space:nowrap;font-weight:700;font-size:14px}
.minebar .got span{display:flex;align-items:center;gap:5px}

/* 아래에서 올라오는 창 */
#veil{position:fixed;inset:0;z-index:4;background:rgba(10,6,3,.28)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:620px;margin:0 auto;border-radius:20px 20px 0 0;border-bottom:0;padding:14px var(--sr) var(--sb) var(--sl);max-height:62vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet h2{margin:0;font-size:18px;flex:1}
.sheet .x{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);font-size:15px}
.sheet p{margin:0 0 8px;line-height:1.55}
.sheet .warn{color:var(--bad);font-size:13px;font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-top:10px}
.btn{height:42px;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px;background:linear-gradient(#5b4532,#49372a);border:2px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 3px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 rgba(0,0,0,.4)}
.btn.primary{background:linear-gradient(var(--accent),var(--accent2));border-color:#a86f1c;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{height:36px;padding:0 12px;font-size:14px}
.tag{font-size:12px;color:var(--dim);margin-right:auto}
.rows{display:flex;flex-direction:column;gap:6px}
.rowi{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:12px;padding:6px 6px 6px 12px;font-weight:700}
.rowi .nm{flex:1;display:flex;align-items:center;gap:8px}
.rowi small{color:var(--dim);font-weight:400}
.floors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.floors .btn{padding:0}
.ico{width:1.35em;height:1.35em;vertical-align:-.32em;margin-right:.25em;flex:none}
.pill .ico,.btn .ico,.bag .ico{margin-right:0}
.pill.icon .ico{width:22px;height:22px}
.ph{color:var(--dim);font-weight:400;font-size:12px}
.ore{display:inline-block;width:12px;height:12px;border-radius:3px;transform:rotate(45deg);flex:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.ore.copper{background:#d97a3a}.ore.iron{background:#c3cbd5}.ore.crystal{background:#7fdcef}.ore.moon{background:#efe9ff;box-shadow:0 0 6px #b9a8ff}

.toast{position:fixed;left:50%;top:calc(var(--st) + 86px);transform:translateX(-50%);z-index:6;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.hud,.dock,.minebar,.sheet,.toast{zoom:var(--z,1)}
</style>
</head>
<body>
<canvas id="cv" aria-label="광부일기"></canvas>
<div class="hud" id="hud"></div>
<div class="dock" id="dock"></div>
<div class="minebar plate" id="minebar" hidden></div>
<div id="veil" hidden></div>
<div class="sheet plate" id="sheet" hidden></div>
<div class="toast plate" id="toast" hidden></div>
<script>
'use strict';
function H32(n) { n = Math.imul(n ^ (n >>> 15), 0x2c1b3c6d); n = Math.imul(n ^ (n >>> 12), 0x297a2d39); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; }
/* ===== 마을 지도 (32×32, 구역: 광장, 서쪽 숲, 남쪽 강과 밭, 북동 언덕, 동쪽 광산) ===== */
const N = 32;
const hgt = (x, y) => (x >= 22 && y <= 8 ? 2 : x >= 21 && y <= 9 ? 1 : 0);
const isWater = (x, y) => y === 23;
const PAVED = new Set();
const pave = (x, y) => PAVED.add(x + ',' + y);
for (let x = 15; x <= 17; x++) for (let y = 15; y <= 17; y++) pave(x, y);
for (let y = 0; y <= 14; y++) pave(16, y);              // 북쪽 큰길 (성문까지)
for (let x = 9; x <= 14; x++) pave(x, 16);              // 서쪽 길
for (let x = 0; x <= 7; x++) pave(x, 16);               // 숲 속 길
for (let x = 18; x <= 25; x++) pave(x, 16);             // 동쪽 길
for (let y = 17; y <= 21; y++) pave(25, y);
for (let x = 26; x <= 28; x++) pave(x, 21);             // 광산 입구 앞
for (let y = 18; y <= 22; y++) pave(16, y);             // 남쪽 길
for (let y = 24; y <= 25; y++) pave(16, y);             // 강 건너
for (let x = 17; x <= 22; x++) pave(x, 8);              // 언덕 가는 길
for (let y = 3; y <= 8; y++) pave(23, y);
[[14, 12], [15, 12], [20, 13], [20, 14], [12, 20], [12, 21], [13, 21], [14, 21], [15, 21], [11, 19], [20, 21], [19, 21], [18, 21], [17, 21], [24, 6], [25, 6]].forEach(([x, y]) => pave(x, y));
// 건물: gx, gy는 뒤쪽 모서리, w×d는 차지하는 칸, door는 문 앞 칸
const OBJ = [
  { id: 'house', gx: 12, gy: 18, w: 2, d: 2, stage: 0, kind: 'house', name: '낡은 집', icon: 'ic_village', door: [12, 20] },
  { id: 'chief', gx: 17, gy: 14, w: 1, d: 1, stage: 0, kind: 'npc', name: '촌장', shirt: '#6a4d8c' },
  { id: 'merchant', gx: 18, gy: 13, w: 1, d: 1, stage: 0, kind: 'wagon', name: '떠돌이 상인' },
  { id: 'mine', gx: 27, gy: 18, w: 3, d: 3, stage: 0, kind: 'mine', name: '광산', icon: 'ic_pick', door: [28, 21] },
  { id: 'tree', gx: 16, gy: 16, w: 1, d: 1, stage: 0, kind: 'bigtree', name: '광장 큰 나무' },
  { id: 'smithy', gx: 11, gy: 11, w: 3, d: 3, stage: 2, kind: 'smithy', name: '대장간', ruin: '부서진 대장간', icon: 'ic_hearth', sign: '고치면 제련과 곡괭이 강화', door: [14, 12] },
  { id: 'bridge', gx: 16, gy: 23, w: 1, d: 1, stage: 4, kind: 'bridge', name: '강가 다리', ruin: '무너진 강가 다리', sign: '고치면 강 건너 밭과 낚시' },
  { id: 'field', gx: 9, gy: 26, w: 6, d: 4, stage: 5, kind: 'field', name: '밭', ruin: '거친 밭', sign: '일구면 농사' },
  { id: 'forest', gx: 4, gy: 16, w: 1, d: 1, stage: 6, kind: 'logs', name: '숲길', ruin: '막힌 숲길', sign: '치우면 채집' },
  { id: 'kitchen', gx: 19, gy: 10, w: 3, d: 3, stage: 7, kind: 'kitchen', name: '식당', ruin: '닫힌 식당', icon: 'ic_rest', sign: '고치면 요리와 주민 의뢰', door: [20, 13] },
  { id: 'market', gx: 19, gy: 18, w: 4, d: 3, stage: 8, kind: 'market', name: '시장', ruin: '빈 시장 터', icon: 'ic_shop', sign: '고치면 매일 바뀌는 시세', door: [20, 21] },
  { id: 'gate', gx: 16, gy: -1, w: 1, d: 1, stage: 9, kind: 'gate', name: '성벽 문', ruin: '닫힌 성벽 문', sign: '고치면 성 밖 사냥터로' },
  { id: 'jewel', gx: 9, gy: 19, w: 2, d: 2, stage: 10, kind: 'jewel', name: '세공소', ruin: '부서진 세공소', icon: 'ic_shard', sign: '고치면 보석 세공', door: [11, 19] },
  { id: 'museum', gx: 24, gy: 2, w: 4, d: 4, stage: 12, kind: 'museum', name: '박물관', ruin: '무너진 박물관', icon: 'ic_treasure', sign: '고치면 도감과 기증', door: [25, 6] },
];
OBJ.forEach(o => { o.done = o.stage === 0; o.grow = o.done ? 1 : 0; });
const inside = (o, x, y) => x >= o.gx && x < o.gx + o.w && y >= o.gy && y < o.gy + o.d;
const objAt = (x, y) => OBJ.find(o => inside(o, x, y));
const field = OBJ.find(o => o.id === 'field');
const inField = (x, y) => inside(field, x, y);
// 나무: 서쪽 숲은 빽빽하게, 나머지는 드문드문 (길, 건물과 그 둘레, 광장 둘레, 밭은 비움)
const nearObj = (x, y) => OBJ.some(o => x >= o.gx - 1 && x <= o.gx + o.w && y >= o.gy - 1 && y <= o.gy + o.d);
// 소품 (장식, 지나갈 수 없음)
const PROPS = [[14, 15, 'bench'], [18, 17, 'bench'], [22, 13, 'barrel'], [14, 14, 'well'], [15, 26, 'hay'], [8, 25, 'hay'], [26, 22, 'barrel']];
const propAtXY = (x, y) => PROPS.some(([a, b]) => a === x && b === y);
const DECO_TREES = [];
for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
  // 숲 울타리: 숲(x 0~4, y 0~21)은 울타리 틈(5,16) 안쪽의 막힌 숲길(4,16)을 치워야 들어감
  if (((x === 5 && y <= 22) || (y === 22 && x <= 5)) && !(x === 5 && y === 16)) { DECO_TREES.push([x, y]); continue; }
  if (PAVED.has(x + ',' + y) || isWater(x, y) || nearObj(x, y) || propAtXY(x, y)) continue;
  if (x >= 9 && x <= 23 && y >= 9 && y <= 22) continue;
  if (Math.abs(x - 16) <= 1 && y <= 1) continue;
  const h = H32(x * 131 + y * 17);
  if (x <= 7 && y <= 21 ? h < .6 : h < .09) DECO_TREES.push([x, y]);
}
const ROCKS = [[27, 25], [29, 27], [21, 27], [26, 12], [5, 28], [21, 3]];
// 덤불: 길, 건물 둘레, 숲을 뺀 풀밭에 드문드문
const BUSHES = [];
for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
  if (PAVED.has(x + ',' + y) || isWater(x, y) || nearObj(x, y) || propAtXY(x, y) || (x <= 7 && y <= 22)) continue;
  if (DECO_TREES.some(([a, b]) => a === x && b === y)) continue;
  if (H32(x * 977 + y * 613 + 11) < .06) BUSHES.push([x, y]);
}
const LAMPS = [[15, 15], [18, 15], [15, 18], [18, 18], [16, 6], [25, 17], [14, 21]];
// 성벽: 마을(0~17) 바깥 한 줄. 성벽 밖은 끝없이 이어지는 들판과 숲
const inTown = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const isWall = (x, y) => ((x === -1 || x === N) && y >= -1 && y <= N) || ((y === -1 || y === N) && x >= -1 && x <= N);
const GATE = [16, -1];
const isRoad = (x, y) => x === GATE[0] && y < -1;
const wildTree = (x, y) => !inTown(x, y) && !isWall(x, y) && !isWater(x, y) && !isRoad(x, y) && H32(x * 7919 + y * 104729 + 7) < .3;
const wildRock = (x, y) => !inTown(x, y) && !isWall(x, y) && !isWater(x, y) && !isRoad(x, y) && !wildTree(x, y) && H32(x * 3571 + y * 2909) < .03;
const blocked = (x, y) => {
  if (Math.abs(x - 16) > 50 || Math.abs(y - 16) > 50) return true;
  if (isWall(x, y)) { const g = OBJ.find(o => o.id === 'gate'); return !(x === GATE[0] && y === GATE[1] && g.done); }
  if (!inTown(x, y)) return isWater(x, y) || wildTree(x, y) || wildRock(x, y);
  if (isWater(x, y)) { const b = OBJ.find(o => o.id === 'bridge'); return !(inside(b, x, y) && b.done); }
  if (DECO_TREES.some(([a, b]) => a === x && b === y)) return true;
  if (ROCKS.some(([a, b]) => a === x && b === y)) return true;
  if (propAtXY(x, y) || BUSHES.some(([a, b]) => a === x && b === y)) return true;
  const o = objAt(x, y);
  if (o && o.kind === 'logs') return !o.done;
  return !!o && o.kind !== 'bridge' && o.kind !== 'field';
};

/* ===== 게임 규칙 설정 ===== */
const KEY = 'minerdiary.v1';
const MAX_ENERGY = 100, DIG_COST = 2, MW = 7, MH = 7, MAX_FLOOR = 5;
const FAINT_LOSS = 0.3;                                    // 쓰러지면 그날 캔 광석 중 잃는 비율 (1단계 임시값)
const START_FRAC = { normal: 1, late: 0.9, faint: 0.7 };
const ORES = {
  copper:  { name: '구리 광석', price: 10,  color: '#d97a3a', light: '#ffb27a' },
  iron:    { name: '철 광석',   price: 25,  color: '#aeb7c2', light: '#eef2f6' },
  crystal: { name: '수정 원석', price: 60,  color: '#5fc9e0', light: '#c9f6ff' },
  moon:    { name: '월광석',    price: 150, color: '#d8cfff', light: '#ffffff' },
};
const ORE_ORDER = ['copper', 'iron', 'crystal', 'moon'];
const FLOOR_ORES = { 1: [['copper', 1]], 2: [['copper', .8], ['iron', .2]], 3: [['copper', .5], ['iron', .5]], 4: [['copper', .35], ['iron', .5], ['crystal', .15]], 5: [['copper', .25], ['iron', .5], ['crystal', .25]] };
const FLOOR_ROCK = { 1: [138, 104, 72], 2: [134, 90, 70], 3: [116, 104, 90], 4: [92, 100, 112], 5: [88, 78, 104] };
const PHASES = [{ name: '아침', at: 0 }, { name: '점심', at: 30 }, { name: '저녁', at: 60 }, { name: '새벽', at: 90 }];
const GOAL = { id: 'smithy', name: '대장간', cost: 500 };
const HOME = [12, 20];   // 낡은 집 문 앞

// 주민 대사는 자연스러운 말투 (화면 안내 글만 간결체)
const INTRO = [
  '어서 와요. 광부들이 다 떠나고 마을이 이렇게 무너져 버렸어요.',
  '광산에서 광석을 캐다가 떠돌이 상인한테 팔아 줘요. 그 돈으로 대장간부터 고치면 좋겠어요.',
  '판 자리에 나오는 숫자는 주변 여덟 칸에 남은 광석 수예요. 같은 광석이 붙어 있으면 한 번에 캐지고요.',
  '기력이 다 떨어지기 전에 집에 가서 자요. 무리하면 쓰러져요.',
];
const CHIEF_TIPS = [
  '숫자가 큰 칸 옆을 파 봐요. 광석이 나올 가능성이 높거든요.',
  '숫자가 없는 칸은 주변에 광석이 없어서, 옆 칸까지 저절로 무너져요.',
  '틈으로 빛이 새는 바위 아래엔 계단이 있어요. 깊을수록 비싼 광석이 나와요.',
  '새벽에 내려간 층에선 가끔 월광석이 보인대요.',
  '새벽까지 무리하면 다음 날 몸이 덜 풀릴 거예요.',
  '기력이 바닥나면 쓰러져요. 그날 캔 것도 조금 잃어버리고요.',
];

/* ===== 퀘스트 (차례대로 하나씩) ===== */
const QUESTS = [
  { id: 'chief', text: '촌장 만나기', target: 'chief' },
  { id: 'enter', text: '광산 들어가기', target: 'mine' },
  { id: 'ore', text: '광석 캐기', need: 5, target: 'mine', reward: 20 },
  { id: 'sell', text: '상인에게 광석 팔기', target: 'merchant', reward: 20 },
  { id: 'sleep', text: '집에서 자기', target: 'house' },
  { id: 'deep', text: '광산 3층 도착', need: 3, target: 'mine', reward: 50 },
  { id: 'gold', text: '대장간 복구비 모으기', need: 500, target: 'smithy' },
];
const questNow = () => QUESTS[S.quest];
const questProg = q => (q.id === 'ore' ? S.qn : q.id === 'deep' ? S.deepest : q.id === 'gold' ? S.gold : 0);
// 일이 일어날 때마다 부름. 지금 퀘스트가 끝났으면 보상을 주고 다음으로
function questEvent(type, n) {
  let q = questNow(), flag = false;
  if (!q) return;
  if (type && q.id === type) { if (q.id === 'ore') S.qn += n || 0; else if (!q.need) flag = true; }
  while ((q = questNow())) {
    if (!(q.need ? questProg(q) >= q.need : flag)) break;
    S.quest++; S.qn = 0; flag = false;
    if (q.reward) S.gold += q.reward;
    toast(`${ico('ic_check')}${q.text}` + (q.reward ? ` ${GOLD}+${q.reward}` : '')); SFX.stairs();
  }
  save(); renderHud();
}

/* ===== 상태와 저장 ===== */
let S;
function freshState() {
  return { v: 2, day: 1, max: MAX_ENERGY, energy: MAX_ENERGY, minE: MAX_ENERGY, dayStart: MAX_ENERGY, gold: 0, inv: {}, today: {}, deepest: 1, screen: 'village', mine: null, mute: false, quest: 0, qn: 0, introSeen: false, chiefDay: 0, restored: [] };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.v === 2) return Object.assign(freshState(), d);
      if (d && d.v === 1) {   // 예전 화면의 기록: 날짜, 돈, 가방 등은 그대로
        const n = freshState();
        ['day', 'energy', 'minE', 'dayStart', 'gold', 'inv', 'today', 'deepest', 'introSeen', 'chiefDay'].forEach(k => { if (d[k] !== undefined) n[k] = d[k]; });
        if (!n.dayStart) n.dayStart = n.energy;
        return n;
      }
    }
  } catch (e) { /* 저장소를 못 쓰면 새로 시작 */ }
  return freshState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ } }

let phase = 0, scene = 'village';
const hero = { x: HOME[0], y: HOME[1], path: [], walk: 0, target: null, speed: 5.2 };
let follow = true;   // 카메라가 광부를 따라감 (끌어서 둘러보면 잠시 멈춤)

let selected = null, fade = 0, dust = [], tnow = 0;

/* ===== 시간 (기력을 쓴 만큼 흐름) ===== */
function usedPct() { return (S.dayStart - S.minE) * 100 / S.max; }
function phaseIndex() { const u = usedPct(); let idx = 0; PHASES.forEach((p, i) => { if (u >= p.at) idx = i; }); return idx; }
function untilNext() {
  const next = PHASES[phaseIndex() + 1];
  if (next) { const left = Math.max(0, Math.ceil(S.minE - (S.dayStart - S.max * next.at / 100))); if (left < S.minE) return { name: next.name, left }; }
  return { name: '쓰러짐', left: S.minE };
}
function spend(n) {
  const before = phaseIndex();
  S.energy = Math.max(0, S.energy - n); S.minE = Math.min(S.minE, S.energy);
  if (S.energy <= 0) { faint(); return false; }
  const after = phaseIndex();
  if (after !== before) { const p = PHASES[after]; toast(p.name); }
  return true;
}
function addItem(o, n) { S.inv[o] = (S.inv[o] || 0) + n; S.today[o] = (S.today[o] || 0) + n; questEvent('ore', n); }
function newDay(kind) {
  S.day += 1; S.energy = Math.round(S.max * START_FRAC[kind]); S.minE = S.dayStart = S.energy;
  S.today = {}; S.mine = null; S.screen = 'village'; scene = 'village';
  hero.x = HOME[0]; hero.y = HOME[1]; hero.path = []; hero.target = null; selected = null;
  cam.to = null; cam.s = 1; follow = true; snapCam(); fade = 1.2;
}
function sleep() {
  const kind = phaseIndex() === 3 ? 'late' : 'normal';
  newDay(kind); questEvent('sleep'); save(); renderHud();
  openSheet(`${S.day}일차 아침`, `<p>${PWR}${S.energy}/${S.max}</p>`);
}
function faint() {
  const lost = {};
  Object.keys(S.today).forEach(o => { const n = Math.min(Math.floor(S.today[o] * FAINT_LOSS), S.inv[o] || 0); if (n > 0) { S.inv[o] -= n; lost[o] = n; } });
  newDay('faint'); save(); renderHud();
  const ls = ORE_ORDER.filter(o => lost[o]).map(o => `<span><span class="ore ${o}"></span> -${lost[o]}</span>`).join(' ');
  openSheet(ico('ic_warn') + '쓰러짐', `<p>${S.day}일차 아침 ${PWR}${S.energy}/${S.max}</p>` + (ls ? `<p class="warn">${ls}</p>` : ''));
}
/* ===== 그림 파일 (아니마룬에서 가져온 에셋). 아직 안 읽혔으면 코드 그림으로 대신 그림 ===== */
const IMG = {};
['vl_lodge', 'vl_mine', 'vl_empty', 'vl_hearth', 'vl_work', 'vm_dirt', 'vm_rock', 'vm_stair', 'tree_a', 'tree_b', 'tree_c', 'bush', 'flower', 'rock', 'bankstone', 'lily', 'reed', 'mush', 'bridge', 'worldtree', 'grass', 'path', 'water',
  'ic_gold', 'ic_pick', 'ic_shop', 'ic_village', 'ic_lock', 'ic_hearth', 'ic_rest', 'ic_shard', 'ic_treasure'].forEach(n => { const im = new Image(); im.onload = () => { im.ok = true; PAT = {}; }; im.src = `assets/${n}.webp`; IMG[n] = im; });
// 바닥 가운데 (cx, by)에 폭 w로 그림. 못 그리면 false
function sprite(c, name, cx, by, w) { const im = IMG[name]; if (!im || !im.ok) return false; const h = w * im.naturalHeight / im.naturalWidth; c.drawImage(im, cx - w / 2, by - h, w, h); return true; }
// 가운데 (x, y)에 크기 s로 아이콘
function emo(c, name, x, y, s) { const im = IMG[name]; if (im && im.ok) c.drawImage(im, x - s / 2, y - s / 2, s, s); }
// 바닥 무늬: 위에서 본 그림을 쿼터뷰 칸 모양으로 눕혀서 채움
let PAT = {};
function pattern(c, name, tiles, ox) {
  const im = IMG[name]; if (!im || !im.ok) return null;
  const key = name + TW;
  if (!PAT[key]) PAT[key] = c.createPattern(im, 'repeat');
  const k = 1 / (im.naturalWidth / tiles);     // 그림 폭이 칸 tiles개
  PAT[key].setTransform(new DOMMatrix([TW / 2 * k, TH / 2 * k, -TW / 2 * k, TH / 2 * k, (ox || 0) * TW, (ox || 0) * TH * .4]));
  return PAT[key];
}

/* ===== 색과 시간대 ===== */
const SKY = [
  { top: '#9fd0f0', bot: '#f6dfbd', tint: 'rgba(255,190,120,.06)', light: 0 },
  { top: '#5fa6e6', bot: '#d4ecff', tint: null, light: 0 },

/* ===== 그리기 기본 ===== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas'), oc = off.getContext('2d');
const msk = document.createElement('canvas'), mc = msk.getContext('2d');
let UIZ = 1;   // 넓은 화면에서 글과 단추를 키우는 비율
let W = 0, H = 0, DPR = 1, TW = 40, TH = 20, ZU = 17, OX = 0, OY = 0;
const DEPTH = 5.5;
const FONT = '"Noto Sans KR",system-ui,sans-serif';
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return `rgb(${[n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v + k)))})`; }
function P(c, pts, f) { c.beginPath(); pts.forEach(([a, b], i) => i ? c.lineTo(a, b) : c.moveTo(a, b)); c.closePath(); c.fillStyle = f; c.fill(); }
function R(c, a, b, w, h, f) { c.fillStyle = f; c.fillRect(a, b, w, h); }
function Cc(c, a, b, r, f) { c.beginPath(); c.arc(a, b, Math.max(0, r), 0, 7); c.fillStyle = f; c.fill(); }
function E(c, a, b, rx, ry, f) { c.beginPath(); c.ellipse(a, b, rx, ry, 0, 0, 7); c.fillStyle = f; c.fill(); }
function L(c, a, b, d, e, col, w) { c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.stroke(); }
function label(c, s, a, b, size, col, bg) {
  c.font = `600 ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(s).width + 12; c.fillStyle = bg; c.beginPath(); c.roundRect(a - w / 2, b - size * .78, w, size * 1.56, size * .78); c.fill();
  c.fillStyle = col; c.fillText(s, a, b + .5);
}
function iso(x, y, z) { return [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2 - z * ZU]; }

function resize() {
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height; DPR = Math.min(W > 700 ? 1.25 : 1.75, window.devicePixelRatio || 1);
  [cv, off, msk].forEach(c => { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); });
  const wide = W > 700;
  TW = wide ? Math.max(80, Math.min(128, W / 16.5)) : Math.max(60, Math.min(96, W / 5.4));
  UIZ = wide ? TW / 80 * .92 : 1;
  document.documentElement.style.setProperty('--z', UIZ.toFixed(3));
  TH = TW / 2; ZU = TW * 0.42;
  OX = 0; OY = 0;
}

/* ===== 마을 그리기 ===== */
function tileTop(c, x, y, z, col) { P(c, [iso(x, y, z), iso(x + 1, y, z), iso(x + 1, y + 1, z), iso(x, y + 1, z)], col); }
function prism(c, x, y, w, d, z0, h, top, left, right) {
  const a = iso(x, y, z0 + h), b = iso(x + w, y, z0 + h), cc = iso(x + w, y + d, z0 + h), e = iso(x, y + d, z0 + h);
  P(c, [e, cc, iso(x + w, y + d, z0), iso(x, y + d, z0)], left);
  P(c, [cc, b, iso(x + w, y, z0), iso(x + w, y + d, z0)], right);
  P(c, [a, b, cc, e], top);
}
function person(c, a, b, s, shirt, helmet, bob, pick, beard) {
  const y = b - (bob || 0) * s;
  E(c, a, b, 6 * s, 2 * s, 'rgba(0,0,0,.25)');
  R(c, a - 3 * s, y - 10 * s, 2.6 * s, 10 * s, '#2c3b55'); R(c, a + .4 * s, y - 10 * s, 2.6 * s, 10 * s, '#2c3b55');
  c.fillStyle = shirt; c.beginPath(); c.roundRect(a - 5 * s, y - 21 * s, 10 * s, 12 * s, 3 * s); c.fill();
  Cc(c, a, y - 25 * s, 4.6 * s, '#f0c79c');
  if (beard) P(c, [[a - 3 * s, y - 24 * s], [a + 3 * s, y - 24 * s], [a, y - 18 * s]], '#eeeae2');
  if (helmet) { c.beginPath(); c.arc(a, y - 26 * s, 5.3 * s, Math.PI, 0); c.fillStyle = '#f2c230'; c.fill(); Cc(c, a + 4 * s, y - 28 * s, 1.4 * s, '#fff6c2'); }
  if (pick !== false && pick != null) { c.save(); c.translate(a + 4 * s, y - 16 * s); c.rotate(-.5 + pick); L(c, 0, 0, 0, -12 * s, '#8b5e34', 2 * s); L(c, -5 * s, -12 * s, 5 * s, -13 * s, '#aab3bb', 2.4 * s); c.restore(); }
}
// 면 하나 (왼쪽 앞면: y 고정, 오른쪽 앞면: x 고정)
function faceL(c, x0, x1, y, z0, z1, col) { P(c, [iso(x0, y, z0), iso(x1, y, z0), iso(x1, y, z1), iso(x0, y, z1)], col); }
function faceR(c, x, y0, y1, z0, z1, col) { P(c, [iso(x, y0, z0), iso(x, y1, z0), iso(x, y1, z1), iso(x, y0, z1)], col); }
// 박공지붕: 긴 쪽을 따라 용마루
function gable(c, x0, y0, x1, y1, z, rh, roof, wall) {
  if (x1 - x0 >= y1 - y0) {
    const ym = (y0 + y1) / 2;
    P(c, [iso(x0, y0, z), iso(x1, y0, z), iso(x1, ym, z + rh), iso(x0, ym, z + rh)], shade(roof, -40));
    P(c, [iso(x1, y0, z), iso(x1, y1, z), iso(x1, ym, z + rh)], wall);
    P(c, [iso(x0, y1, z), iso(x1, y1, z), iso(x1, ym, z + rh), iso(x0, ym, z + rh)], roof);
    for (let k = 1; k < 5; k++) { const t = k / 5; const a = iso(x0, y1 + (ym - y1) * t, z + rh * t), b = iso(x1, y1 + (ym - y1) * t, z + rh * t); L(c, a[0], a[1], b[0], b[1], 'rgba(0,0,0,.12)', 1); }
  } else {
    const xm = (x0 + x1) / 2;
    P(c, [iso(x0, y0, z), iso(x0, y1, z), iso(xm, y1, z + rh), iso(xm, y0, z + rh)], shade(roof, -40));
    P(c, [iso(x1, y0, z), iso(x1, y1, z), iso(xm, y1, z + rh), iso(xm, y0, z + rh)], shade(roof, -22));
    P(c, [iso(x0, y1, z), iso(x1, y1, z), iso(xm, y1, z + rh)], wall);
  }
}
function pyramidRoof(c, x0, y0, x1, y1, z, rh, roof) {
  const ap = iso((x0 + x1) / 2, (y0 + y1) / 2, z + rh);
  P(c, [iso(x0, y1, z), iso(x1, y1, z), ap], roof); P(c, [iso(x1, y1, z), iso(x1, y0, z), ap], shade(roof, -28));
}
// 간판: 문 위에 걸린 판과 그림
function signBoard(c, o, z, hgtZ, alpha) {
  if (!o.icon || !o.door) return;
  const [dx, dy] = o.door, onLeft = dy === o.gy + o.d;
  const p = onLeft ? iso(dx + .5, o.gy + o.d, z + hgtZ) : iso(o.gx + o.w, dy + .5, z + hgtZ);
  const s = TW * .42;
  c.globalAlpha *= alpha;
  c.fillStyle = 'rgba(40,26,14,.92)'; c.beginPath(); c.roundRect(p[0] - s / 2, p[1] - s / 2, s, s, s * .22); c.fill();
  c.strokeStyle = '#e9b04f'; c.lineWidth = Math.max(1.5, TW * .025); c.stroke();
  emo(c, o.icon, p[0], p[1] + s * .04, (s * .66) * 1.3);
  c.globalAlpha /= alpha;
}
function doorOn(c, o, z, w, h, col) {
  const [dx, dy] = o.door;
  if (dy === o.gy + o.d) faceL(c, dx + .5 - w / 2, dx + .5 + w / 2, o.gy + o.d - .1, z, z + h, col);
  else faceR(c, o.gx + o.w - .1, dy + .5 - w / 2, dy + .5 + w / 2, z, z + h, col);
}
function windowL(c, x, y, z, w, h, night) { faceL(c, x, x + w, y, z, z + h, night ? '#ffd27a' : '#4b6070'); faceL(c, x, x + w, y, z + h * .45, z + h * .55, 'rgba(255,255,255,.35)'); }
function windowR(c, x, y, z, w, h, night) { faceR(c, x, y, y + w, z, z + h, night ? '#ffd27a' : '#3f5260'); }
function smoke(c, x, y, z, seed, dark) { for (let k = 0; k < 4; k++) { const ph = (tnow * .32 + k / 4 + seed * .13) % 1; const p = iso(x, y, z + ph * 2.4); Cc(c, p[0] + Math.sin(ph * 6 + seed) * TW * .1, p[1], TW * (.07 + ph * .16), dark ? `rgba(90,85,80,${.5 * (1 - ph)})` : `rgba(245,245,245,${.5 * (1 - ph)})`); } }

// 무너진 터 (여러 칸)
function ruinSite(c, o) {
  const z = hgt(o.gx, o.gy), x0 = o.gx, y0 = o.gy, x1 = o.gx + o.w, y1 = o.gy + o.d;
  if (o.kind === 'bridge' || o.kind === 'field' || o.kind === 'logs' || o.kind === 'gate') return;
  // 뒤쪽 두 벽만 무너진 채 남음
  for (let i = 0; i < o.w; i++) { const h = .25 + H32(o.gx * 7 + i) * .9; prism(c, x0 + i + .05, y0 + .1, .9, .22, z, h, '#a39a8e', '#8f867b', '#776f65'); }
  for (let j = 1; j < o.d; j++) { const h = .2 + H32(o.gy * 5 + j) * .8; prism(c, x0 + .1, y0 + j + .05, .22, .9, z, h, '#a39a8e', '#8f867b', '#776f65'); }
  for (let k = 0; k < o.w * o.d * 3; k++) { const p = iso(x0 + .3 + H32(k * 13 + o.gx) * (o.w - .6), y0 + .5 + H32(k * 7 + o.gy) * (o.d - .8), z); E(c, p[0], p[1] - 2, TW * (.08 + H32(k) * .07), TW * .05, ['#8a7f75', '#776d64', '#9a8f84'][k % 3]); }
  const a = iso(x0 + .6, y0 + .8, z + .9), b = iso(x1 - .4, y1 - .5, z); L(c, a[0], a[1], b[0], b[1], '#6e5034', TW * .07);
  // 팻말과 간판 그림 (흐리게)
  if (o.door) {
    const [dx, dy] = o.door, sp = iso(dx + .5, dy + .5, hgt(dx, dy));
    L(c, sp[0], sp[1], sp[0], sp[1] - ZU * 1.5, '#6b4a2a', TW * .05);
    const s = TW * .38; c.fillStyle = '#8a6a44'; c.beginPath(); c.roundRect(sp[0] - s / 2, sp[1] - ZU * 1.5 - s * .8, s, s * .8, 3); c.fill();
    c.globalAlpha *= .7; emo(c, o.icon, sp[0], sp[1] - ZU * 1.5 - s * .4, (s * .5) * 1.3); c.globalAlpha /= .7;
  }
}

// 건물별 생김새 (g: 솟아오르는 정도 0~1)
function drawBuilding(c, o, night) {
  const g = o.grow, z = hgt(o.gx, o.gy), x0 = o.gx, y0 = o.gy, x1 = o.gx + o.w, y1 = o.gy + o.d;
  if (g < .02) return;
  const mid = (a, b) => (a + b) / 2;
  switch (o.kind) {
    case 'house': {   // 나무 오두막: 빨간 박공지붕, 굴뚝, 꽃 상자
      const h = 1.6 * g, i = .15;
      prism(c, x0 + i, y0 + i, o.w - 2 * i, o.d - 2 * i, z, h, '#e2c08f', '#d8b07f', '#b98f60');
      for (let k = 1; k < 5; k++) { faceL(c, x0 + i, x1 - i, y1 - i, z + h * k / 5 - .02, z + h * k / 5, 'rgba(90,55,25,.25)'); faceR(c, x1 - i, y0 + i, y1 - i, z + h * k / 5 - .02, z + h * k / 5, 'rgba(70,40,15,.25)'); }
      windowL(c, x0 + 1.2, y1 - i, z + h * .45, .45, .45 * g, night); windowR(c, x1 - i, y0 + .5, z + h * .45, .5, .45 * g, night);
      faceL(c, x0 + 1.15, x0 + 1.7, y1 - i + .01, z + h * .38, z + h * .45, '#7a4a2a'); for (let k = 0; k < 4; k++) { const p = iso(x0 + 1.2 + k * .14, y1 - i, z + h * .47); Cc(c, p[0], p[1], TW * .035, ['#f08aa0', '#f2d35b'][k % 2]); }
      doorOn(c, o, z, .42, 1.0 * g, '#6a4226');
      if (g > .6) { prism(c, x0 + .55, y0 + .35, .3, .3, z + h, 1.3, '#9a5a44', '#8a4a3a', '#6e3a2c'); gable(c, x0 + i - .12, y0 + i - .12, x1 - i + .12, y1 - i + .12, z + h, 1.1 * g, '#b5473a', '#d9b48a'); smoke(c, x0 + .7, y0 + .5, z + h + 1.4, 1); }
      if (night) { const w = iso(x0 + 1.4, y1, z + h * .6); Cc(c, w[0], w[1], TW * .6, 'rgba(255,200,110,.16)'); }
      signBoard(c, o, z, 1.3 * g, 1);
      break;
    }

const oreRow = src => ORE_ORDER.filter(o => src[o]).map(o => `<span><span class="ore ${o}"></span>${src[o]}</span>`).join('');
function renderDock() {
  const mine = scene === 'mine';
  minebar.hidden = !mine;
  dock.hidden = mine || !sheet.hidden;
  if (!dock.hidden) dock.innerHTML = `<span></span><button class="bag plate" data-a="bag" aria-label="가방">${ico('ic_bag')}${bagCount()}</button>`;
  if (mine && S.mine) {
    const m = S.mine, stairs = m.tiles.some(t => t.t === 'x' && t.open);
    minebar.innerHTML = `<button class="btn small" data-a="leave" aria-label="마을로">${ico('ic_village')}</button><b>${m.floor}층</b>
      <div class="got">${oreRow(S.today)}</div>
      ${m.floor < MAX_FLOOR ? `<button class="btn small ${stairs ? 'primary' : ''}" data-a="descend" ${stairs ? '' : 'disabled'}>${m.floor + 1}층 ▼</button>` : ''}`;
  }
}
function openSheet(title, body, btns, closable = true) {
  sheet.innerHTML = `<header><h2>${title}</h2>${closable ? '<button class="x" data-a="close" aria-label="닫기">✕</button>' : ''}</header>${body}${btns ? `<div class="btns">${btns}</div>` : ''}`;
  document.getElementById('veil').hidden = false;
  sheet.hidden = false; sheet.style.animation = 'none'; void sheet.offsetWidth; sheet.style.animation = '';
  renderDock();
}
function hideSheet() { sheet.hidden = true; document.getElementById('veil').hidden = true; renderDock(); }
function closeSheet() { selected = null; hideSheet(); }
function sheetH() { return sheet.hidden ? 0 : sheet.getBoundingClientRect().height; }
function bottomH() { return scene === 'mine' ? minebar.getBoundingClientRect().height : Math.max(sheetH(), 64); }
// 마을 기본 상태로 (창 닫기). 처음엔 촌장 소개부터
function showHome() { closeSheet(); }
function showIntro(k) {
  const last = k === INTRO.length - 1;
  openSheet('촌장', `<p>${INTRO[k]}</p>`, `<span class="tag">${k + 1}/${INTRO.length}</span>${k ? `<button class="btn" data-a="introPrev" data-n="${k - 1}">이전</button>` : ''}<button class="btn primary" data-a="${last ? 'introDone' : 'intro'}" data-n="${k + 1}">${last ? '확인' : '다음'}</button>`);
}
function showCard(o, msg) {
  if (!o) return;
  if (msg) { toast(msg); return; }
  if (!o.done) {
    const goal = o.id === GOAL.id;
    openSheet(`${ico(o.icon || 'ic_lock')}${o.ruin}`, `<p>${o.sign}</p>`, goal ? `<span class="tag">준비 중</span><button class="btn" disabled>${GOLD}${GOAL.cost}</button>` : '');
    return;
  }
  if (o.id === 'house') {
    const late = phaseIndex() === 3;
    openSheet(ico('ic_village') + '낡은 집', `<p>${S.day + 1}일차 아침까지</p>` + (late ? `<p class="warn">새벽 취침은 내일 ${PWR}${Math.round(S.max * START_FRAC.late)}</p>` : ''), '<button class="btn primary" data-a="sleep">자기</button>');
  } else if (o.id === 'chief') {
    if (!S.introSeen) { showIntro(0); return; }
    let line;
    if (S.gold >= GOAL.cost) line = '대장간 고칠 돈은 다 모였네요. 이제 대장장이가 돌아오기만 기다리면 돼요.';
    else if (S.chiefDay !== S.day) { line = CHIEF_TIPS[(S.day - 1) % CHIEF_TIPS.length]; S.chiefDay = S.day; save(); }
    else line = `다음은 대장간이에요. ${GOLD}${GOAL.cost - S.gold}만 더 모으면 돼요.`;
    openSheet('촌장', `<p>${line}</p>`);
  } else if (o.id === 'merchant') showMerchant();
  else if (o.id === 'mine') {
    const f = []; for (let i = 1; i <= S.deepest; i++) f.push(`<button class="btn" data-a="enter" data-n="${i}">${i}층</button>`);
    openSheet(ico('ic_pick') + '광산', `<div class="floors">${f.join('')}</div>`);
  } else openSheet(`${o.icon ? ico(o.icon) : ''}${o.name}`, '');
}
function showMerchant() {
  const rows = ORE_ORDER.filter(o => S.inv[o]).map(o => { const n = S.inv[o], p = ORES[o].price; return `<div class="rowi"><span class="nm"><span class="ore ${o}"></span>${ORES[o].name} <small>×${n}</small></span><button class="btn small" data-a="sell" data-o="${o}">${GOLD}${p * n}</button></div>`; }).join('');
  const total = ORE_ORDER.reduce((a, o) => a + (S.inv[o] || 0) * ORES[o].price, 0);
  openSheet(ico('ic_shop') + '떠돌이 상인', rows ? `<div class="rows">${rows}</div>` : '<p>광석이라면 뭐든 사 갈게요.</p>', total ? `<button class="btn primary" data-a="sellAll">전부 ${GOLD}${total}</button>` : '');
}
function showBag() {
  const rows = ORE_ORDER.filter(o => S.inv[o]).map(o => `<div class="rowi"><span class="nm"><span class="ore ${o}"></span>${ORES[o].name}</span><span>×${S.inv[o]}</span><small>${GOLD}${ORES[o].price * S.inv[o]}</small></div>`).join('');
  openSheet(ico('ic_bag') + '가방', rows ? `<div class="rows">${rows}</div>` : '<p>빈 가방</p>');
}
function showMenu() {
  openSheet(ico('ic_settings') + '설정', '', `<button class="btn" data-a="mute">${S.mute ? ico('ic_mute') + '소리 꺼짐' : ico('ic_sound') + '소리 켜짐'}</button><button class="btn" data-a="resetAsk">처음부터</button>`);
}
function sell(o) { const n = S.inv[o] || 0; if (!n) return; S.inv[o] = 0; S.gold += ORES[o].price * n; SFX.coin(); toast(`${GOLD}+${ORES[o].price * n}`); questEvent('sell'); save(); renderHud(); showMerchant(); }
function sellAll() { let g = 0; ORE_ORDER.forEach(o => { g += (S.inv[o] || 0) * ORES[o].price; S.inv[o] = 0; }); if (!g) return; S.gold += g; SFX.coin(); toast(`${GOLD}+${g}`); questEvent('sell'); save(); renderHud(); showMerchant(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, n = +b.dataset.n;
  SFX.tap();
  if (a === 'close') closeSheet();
  else if (a === 'intro' || a === 'introPrev') showIntro(n);
  else if (a === 'introDone') { S.introSeen = true; S.chiefDay = S.day; closeSheet(); questEvent('chief'); }
  else if (a === 'sleep') sleep();
  else if (a === 'enter') enterMine(n);
  else if (a === 'leave') { hideSheet(); leaveMine(); }
  else if (a === 'descend') descend();
  else if (a === 'digForce') { hideSheet(); dig(n, true); }
  else if (a === 'sell') sell(b.dataset.o);
  else if (a === 'sellAll') sellAll();
  else if (a === 'bag') showBag();
  else if (a === 'menu') showMenu();
  else if (a === 'quest') { const q = questNow(); if (q && scene === 'village' && !cam.to) { const o = OBJ.find(v => v.id === q.target); mark(o.gx, o.gy, '233,176,79', o.w, o.d); goTo(o); } }
  else if (a === 'mute') { S.mute = !S.mute; save(); showMenu(); }
  else if (a === 'resetAsk') openSheet('처음부터', '<p class="warn">모든 기록 삭제</p>', '<button class="btn primary" data-a="reset">삭제</button>');
  else if (a === 'reset') { S = freshState(); applyRestored(); newDayReset(); save(); renderHud(); showHome(); }
});
function newDayReset() { scene = 'village'; hero.x = HOME[0]; hero.y = HOME[1]; hero.path = []; selected = null; cam.to = null; cam.s = 1; follow = true; snapCam(); }
function applyRestored() { OBJ.forEach(o => { o.done = o.stage === 0 || S.restored.includes(o.id); o.grow = o.done ? 1 : 0; }); }
let toastT = 0;
function toast(s) { const t = document.getElementById('toast'); t.innerHTML = s; t.hidden = false; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; setTimeout(() => { t.hidden = true; }, 300); }, 1500); }
/* ===== 내 위치 말풍선 (광부가 화면 밖일 때) ===== */
let bubble = null;
function drawBubble(c) {
  bubble = null;
  if (scene !== 'village' || cam.to) return;
  const w = iso(hero.x + .5, hero.y + .5, heroZ());
  const sx = (w[0] - cam.fx) * cam.s + W / 2, sy = (w[1] - ZU * 1.2 - cam.fy) * cam.s + H / 2;
  const top = hudH() - 4, bot = H - bottomH() - 8;
  const x0 = 34, x1 = W - 34, y0 = top + 30, y1 = bot - 30;
  if (sx > 0 && sx < W && sy > top - 20 && sy < bot + 10) return;
  // 화면 가운데에서 광부 쪽으로 뻗은 선이 안쪽 사각형과 만나는 곳
  const cx = W / 2, cy = (y0 + y1) / 2, dx = sx - cx, dy = sy - cy;
  const k = Math.min(dx ? Math.abs((dx > 0 ? x1 - cx : cx - x0) / dx) : 1e9, dy ? Math.abs((dy > 0 ? y1 - cy : cy - y0) / dy) : 1e9);
  const bx = cx + dx * k, by = cy + dy * k, ang = Math.atan2(dy, dx);
  const pulse = 1 + .06 * Math.sin(tnow * 5);
  c.save(); c.translate(bx, by); c.scale(pulse, pulse);
  c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 8;
  // 말풍선 꼬리 (광부 쪽)
  c.fillStyle = '#fff7e6';
  c.beginPath(); c.moveTo(Math.cos(ang) * 31, Math.sin(ang) * 31); c.lineTo(Math.cos(ang + .5) * 19, Math.sin(ang + .5) * 19); c.lineTo(Math.cos(ang - .5) * 19, Math.sin(ang - .5) * 19); c.closePath(); c.fill();
  c.beginPath(); c.arc(0, 0, 22, 0, 7); c.fill();
  c.shadowBlur = 0;
  c.lineWidth = 2.5; c.strokeStyle = '#e9b04f'; c.stroke();
  // 광부 얼굴
  Cc(c, 0, 3, 9, '#f0c79c'); c.beginPath(); c.arc(0, 1, 10.5, Math.PI, 0); c.fillStyle = '#f2c230'; c.fill(); R(c, -12, 0, 24, 3, '#d9a71e'); Cc(c, 7, -4, 2.4, '#fff6c2');
  Cc(c, -3, 6, 1.2, '#2b1d10'); Cc(c, 3, 6, 1.2, '#2b1d10');
  c.restore();
  bubble = { x: bx, y: by };
}
function recenter() { if (scene === 'village') { follow = true; down = null; } }
window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); recenter(); } });

/* ===== 그리기 반복 ===== */
let last = 0;
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms) {
  const dt = Math.min(.05, (ms - last) / 1000 || 0); last = ms; tnow = ms / 1000;
  phase = phaseIndex();
  walkStep(dt); camStep(dt);
  if (scene === 'village' && follow && !cam.to) { const [tx, ty] = heroFocus(); const k = Math.min(1, dt * 5); cam.fx += (tx - cam.fx) * k; cam.fy += (ty - cam.fy) * k; }
  OBJ.forEach(o => { if (o.done && o.grow < 1) o.grow = Math.min(1, o.grow + dt * 1.6); });
  if (scene === 'mine' && S.mine) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawMine(ctx, dt);
  } else {
    // 마을은 따로 그린 뒤, 위아래만 흐리게 해서 작은 모형처럼
    oc.setTransform(DPR, 0, 0, DPR, 0, 0); drawSky(oc);
    oc.setTransform(DPR * cam.s, 0, 0, DPR * cam.s, DPR * (W / 2 - cam.fx * cam.s), DPR * (H / 2 - cam.fy * cam.s));
    drawIsland(oc);
    oc.setTransform(DPR, 0, 0, DPR, 0, 0); if (SKY[phase].tint) R(oc, 0, 0, W, H, SKY[phase].tint);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const blur = cam.s > 1.05 ? 0 : 4;
    if (blur) { ctx.filter = `blur(${blur * DPR}px)`; ctx.drawImage(off, 0, 0); ctx.filter = 'none'; }
    mc.setTransform(1, 0, 0, 1, 0, 0); mc.globalCompositeOperation = 'source-over'; mc.clearRect(0, 0, msk.width, msk.height); mc.drawImage(off, 0, 0);
    if (blur) {
      const g = mc.createLinearGradient(0, 0, 0, msk.height);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.26, 'rgba(0,0,0,1)'); g.addColorStop(.7, 'rgba(0,0,0,1)'); g.addColorStop(.92, 'rgba(0,0,0,0)');
      mc.globalCompositeOperation = 'destination-in'; mc.fillStyle = g; mc.fillRect(0, 0, msk.width, msk.height); mc.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(msk, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .85); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,10,0,.3)'); R(ctx, 0, 0, W, H, v);
    drawBubble(ctx);
  }
  if (fade > 0) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); R(ctx, 0, 0, W, H, `rgba(0,0,0,${Math.min(1, fade)})`); fade = Math.max(0, fade - dt * 1.6); }
  requestAnimationFrame(frame);
}

/* ===== 입력 ===== */
let down = null;
// 누른 순간부터 뗄 때까지 움직임을 붙잡아, 손가락이 그림 밖이나 창 밖으로 나가도 계속 끌림
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, fx: cam.fx, fy: cam.fy, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ } });
cv.addEventListener('pointermove', e => {
  if (!down || scene !== 'village' || cam.to) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (!down.moved && Math.hypot(dx, dy) > 10) { down.moved = true; follow = false; }
  if (down.moved) { cam.fx = down.fx - dx / cam.s; cam.fy = down.fy - dy / cam.s; }
});
cv.addEventListener('pointerup', e => { if (!down) return; if (!down.moved) tap(e.clientX, e.clientY); down = null; });
cv.addEventListener('pointercancel', () => { down = null; });
cv.addEventListener('lostpointercapture', () => { if (down && down.moved) down = null; });
window.addEventListener('resize', () => { resize(); if (scene === 'village') snapCam(); });

/* ===== 시작 ===== */
S = load();
if (S.introSeen && S.quest === 0) S.quest = 1;   // 퀘스트가 없던 때의 기록
applyRestored();
resize();
if (S.screen === 'mine' && S.mine) scene = 'mine'; else { S.screen = 'village'; S.mine = null; }
snapCam(); renderHud(); renderDock(); showHome();
requestAnimationFrame(frame);
if (still) fade = 0;
// 테스트용 창구: 상태 읽기, 칸과 건물의 화면 위치, 걷는 빠르기
window.MinerDiary = {
  state: () => S, hint, canDig, phaseIndex, untilNext, objects: () => OBJ, scene: () => scene,
  tilePoint: i => tileCenter(i),
  spotPoint: id => {
    const o = OBJ.find(q => q.id === id); follow = false;
    const z = hgt(o.gx, o.gy), up = o.kind === 'npc' || o.kind === 'wagon' ? 1 : .6;
    const p = iso(o.gx + o.w / 2, o.gy + o.d / 2, z + up); cam.fx = p[0]; cam.fy = p[1];
    return { x: W / 2, y: H / 2 };
  },
  speed: k => { hero.speed = 5.2 * k; },
};
</script>
</body>
