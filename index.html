<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#1f1812">
<title>광부일기</title>
<style>
:root{
  --bg:#1f1812; --panel:#2e241b; --panel2:#3a2e23; --line:#4a3b2d;
  --text:#f3e9dc; --dim:#b8a690; --accent:#e0a84a; --good:#8fcf7a; --bad:#e07a6a;
  --rock:#5a4634; --rock-can:#7a5f45; --open:#2a2119;
  --copper:#d0793d; --iron:#b4bcc6; --crystal:#7fd4e6; --moon:#ece6ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 12px 24px}

/* HUD */
#hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.hud-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
.chip.gold{margin-left:auto;color:var(--accent);font-weight:700}
.chip.until{color:var(--dim);font-size:13px}
.ebar{position:relative;height:12px;margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ebar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d9b44a,#f0d27a);transition:width .25s}
.ebar .mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.45)}
.ebar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:3px}
.goal{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.goal .bar{height:6px;background:var(--open);border-radius:3px;margin-top:6px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--accent)}

/* 마을 */
h2{font-size:17px;margin:14px 0 8px}
.places{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.place{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;display:flex;gap:10px;align-items:center;min-height:62px}
.place:active{transform:scale(.98)}
.place .ic{font-size:26px;line-height:1}
.place b{display:block;font-size:15px}
.place small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.place.ruin{background:transparent;border-style:dashed;opacity:.75}
.place.ruin .ic{filter:grayscale(1)}
.place.next{opacity:1;border-color:var(--accent)}
.inv{display:flex;flex-wrap:wrap;gap:6px}
.inv .chip{display:flex;align-items:center;gap:6px}
.empty{color:var(--dim);font-size:14px}

/* 광석 표시 */
.ore{display:inline-block;width:12px;height:12px;border-radius:3px;transform:rotate(45deg);flex:none;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.ore.copper{background:var(--copper)} .ore.iron{background:var(--iron)}
.ore.crystal{background:var(--crystal)} .ore.moon{background:var(--moon);box-shadow:0 0 6px #b9a8ff}

/* 광산 */
.minebar{display:flex;align-items:center;gap:8px;margin:10px 0}
.minebar b{font-size:17px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2b1d0c;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn.right{margin-left:auto}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--panel);padding:6px;border-radius:12px;border:1px solid var(--line)}
.tile{aspect-ratio:1;border:0;border-radius:6px;background:var(--rock);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;padding:0;position:relative}
.tile.can{background:var(--rock-can);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tile.can:active{transform:scale(.92)}
.tile.open{background:var(--open);box-shadow:none}
.tile.hard{background:#3b3631;box-shadow:inset 0 0 0 2px #55504a;font-size:20px}
.tile.stairs{background:#4b3a22;font-size:22px;animation:pulse 1.4s infinite}
.tile.dug{animation:pop .25s}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--accent)}}
.n1{color:#9fd3ff}.n2{color:#a7e39a}.n3{color:#ffd27a}.n4{color:#ffa36b}.n5,.n6,.n7,.n8{color:#ff7d7d}
.legend{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.5}

/* 창 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:456px;padding:16px;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet p{margin:6px 0;line-height:1.55;font-size:15px}
.sheet .note{color:var(--dim);font-size:12px}
.sheet .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:flex-end}
.sell{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sell .nm{flex:1;display:flex;align-items:center;gap:8px;font-size:15px}
.sell .nm small{color:var(--dim)}
.floors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}

/* 알림 */
#toasts{position:fixed;left:0;right:0;top:118px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,15,10,.92);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;animation:tin .2s,tout .3s 1.9s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@keyframes tout{to{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <main id="screen"></main>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script>
'use strict';

/* ===== 설정 ===== */
const KEY = 'minerdiary.v1';
const MAX_ENERGY = 100;
const DIG_COST = 2;
const W = 7, H = 7;
const MAX_FLOOR = 5;
const FAINT_LOSS = 0.3;              // 쓰러지면 그날 얻은 광석 중 잃는 비율 (1단계 임시값)
const START_FRAC = { normal: 1, late: 0.9, faint: 0.7 };

const ORES = {
  copper:  { name: '구리 광석', price: 10 },
  iron:    { name: '철 광석',   price: 25 },
  crystal: { name: '수정 원석', price: 60 },
  moon:    { name: '월광석',    price: 150 },
};
const ORE_ORDER = ['copper', 'iron', 'crystal', 'moon'];
const FLOOR_ORES = {
  1: [['copper', 1]],
  2: [['copper', .8], ['iron', .2]],
  3: [['copper', .5], ['iron', .5]],
  4: [['copper', .35], ['iron', .5], ['crystal', .15]],
  5: [['copper', .25], ['iron', .5], ['crystal', .25]],
};
// 시간대: 오늘 깨어난 뒤 쓴 기력(최대 기력 대비 %)이 at 이상이면 그 시간대
const PHASES = [
  { name: '아침', icon: '🌅', at: 0 },
  { name: '점심', icon: '☀️', at: 30 },
  { name: '저녁', icon: '🌇', at: 60 },
  { name: '새벽', icon: '🌙', at: 90 },
];
const GOAL = { id: 'smithy', name: '대장간', cost: 500 };
const RUINS = [
  { id: 'smithy',  name: '부서진 대장간', icon: '⚒️', sign: '고치면 제련과 곡괭이 강화' },
  { id: 'bridge',  name: '무너진 강가 다리', icon: '🌉', sign: '고치면 낚시' },
  { id: 'field',   name: '거친 밭', icon: '🌱', sign: '일구면 농사' },
  { id: 'forest',  name: '막힌 숲길', icon: '🌲', sign: '치우면 채집' },
  { id: 'kitchen', name: '닫힌 식당', icon: '🍲', sign: '고치면 요리와 주민 의뢰' },
  { id: 'market',  name: '빈 시장 터', icon: '🏪', sign: '고치면 매일 바뀌는 시세' },
  { id: 'gate',    name: '닫힌 성벽 문', icon: '🏰', sign: '고치면 사냥' },
  { id: 'jewel',   name: '부서진 세공소', icon: '💍', sign: '고치면 보석 세공' },
  { id: 'museum',  name: '무너진 박물관', icon: '🏛️', sign: '고치면 도감과 기증' },
];
const INTRO = [
  '광부들이 떠난 뒤 무너진 채 남은 마을',
  '남은 건 광산과 가끔 들르는 떠돌이 상인뿐',
  '광산은 위에서부터 이어서 캐고, 칸의 숫자는 주변 8칸에 남은 광석 수',
  '이어진 같은 광석은 한 번에 캐지고 길수록 덤이 붙음',
  '캔 광석은 떠돌이 상인에게 팔고, 모은 돈으로 대장간부터 복구',
  '기력을 쓴 만큼 해가 기울고 집에서 자면 다음 날',
];
const CHIEF_TIPS = [
  '숫자가 큰 칸 옆을 파면 광석이 나올 확률이 높음',
  '0인 칸 주변엔 광석이 없으니 다른 쪽으로',
  '계단을 찾으면 더 깊은 층으로 가고, 깊을수록 비싼 광석',
  '새벽에 내려간 층엔 가끔 월광석',
  '새벽까지 버티면 다음 날 기력이 조금 덜 참',
  '기력이 바닥나면 쓰러져서 그날 캔 것 일부를 잃음',
];

/* ===== 상태 ===== */
let S;
function freshState() {
  return {
    v: 1, day: 1, max: MAX_ENERGY, energy: MAX_ENERGY, minE: MAX_ENERGY, dayStart: MAX_ENERGY,
    gold: 0, inv: {}, today: {}, deepest: 1,
    screen: 'village', mine: null, introSeen: false, chiefDay: 0,
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && d.v === 1) return Object.assign(freshState(), d);
    }
  } catch (e) { /* 저장소를 못 쓰면 새로 시작 */ }
  return freshState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ }
}

/* ===== 시간 ===== */
function usedPct() { return (S.dayStart - S.minE) * 100 / S.max; }
function phaseIndex() {
  const u = usedPct();
  let idx = 0;
  PHASES.forEach((p, i) => { if (u >= p.at) idx = i; });
  return idx;
}
function untilNext() {
  const i = phaseIndex();
  const next = PHASES[i + 1];
  if (next) {
    const left = Math.max(0, Math.ceil(S.minE - (S.dayStart - S.max * next.at / 100)));
    if (left < S.minE) return { name: next.name, left };
  }
  return { name: '쓰러짐', left: S.minE };
}
function spend(n) {
  const before = phaseIndex();
  S.energy = Math.max(0, S.energy - n);
  S.minE = Math.min(S.minE, S.energy);
  const after = phaseIndex();
  if (S.energy <= 0) { faint(); return false; }
  if (after !== before) {
    const p = PHASES[after];
    toast(after === 3 ? `${p.icon} 새벽이라 새로 내려간 층에 희귀 광석` : `${p.icon} ${p.name}`);
  }
  return true;
}

/* ===== 하루 ===== */
function addItem(o, n) {
  S.inv[o] = (S.inv[o] || 0) + n;
  S.today[o] = (S.today[o] || 0) + n;
}
function newDay(kind) {
  S.day += 1;
  S.energy = Math.round(S.max * START_FRAC[kind]);
  S.minE = S.energy;
  S.dayStart = S.energy;
  S.today = {};
  S.mine = null;
  S.screen = 'village';
}
function sleep() {
  const kind = phaseIndex() === 3 ? 'late' : 'normal';
  newDay(kind);
  save(); render();
  modal({
    title: `🌅 ${S.day}일차 아침`,
    body: `<p>기력 ⚡${S.energy}</p>` + (kind === 'late' ? '<p class="note">새벽까지 깨어 있던 탓에 기력이 조금 덜 참</p>' : ''),
    buttons: [{ label: '확인', act: 'close', primary: true }],
  });
}
function faint() {
  const lost = {};
  for (const o of Object.keys(S.today)) {
    const n = Math.min(Math.floor(S.today[o] * FAINT_LOSS), S.inv[o] || 0);
    if (n > 0) { S.inv[o] -= n; lost[o] = n; }
  }
  newDay('faint');
  save(); render();
  const lostHtml = Object.keys(lost).length
    ? '<p>잃은 것: ' + ORE_ORDER.filter(o => lost[o]).map(o => `${ORES[o].name} ${lost[o]}`).join(', ') + '</p>'
    : '<p>잃은 것 없음</p>';
  modal({
    title: '😵 쓰러짐',
    body: `<p>집에서 깨어나니 ${S.day}일차 아침</p>${lostHtml}<p>기력 ⚡${S.energy}</p><p class="note">쓰러진 다음 날은 기력이 덜 참</p>`,
    buttons: [{ label: '확인', act: 'close', primary: true }],
  });
}

/* ===== 광산 ===== */
function rnd(n) { return Math.floor(Math.random() * n); }
function pickOre(floor) {
  const list = FLOOR_ORES[floor];
  let r = Math.random(), acc = 0;
  for (const [o, w] of list) { acc += w; if (r < acc) return o; }
  return list[list.length - 1][0];
}
function orth(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  if (x > 0) out.push(i - 1);
  if (x < W - 1) out.push(i + 1);
  if (y > 0) out.push(i - W);
  if (y < H - 1) out.push(i + W);
  return out;
}
function around(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) out.push(ny * W + nx);
  }
  return out;
}
function genBoard(floor, dawn) {
  const t = Array.from({ length: W * H }, () => ({ t: 's', open: false }));
  const bottom = floor === MAX_FLOOR ? H - 1 : H;   // 5층 맨 아래 줄은 단단한 바위
  if (floor === MAX_FLOOR) for (let x = 0; x < W; x++) t[(H - 1) * W + x].t = 'h';
  const stoneAt = minRow => {
    const c = [];
    for (let i = 0; i < W * H; i++) if (t[i].t === 's' && ((i / W) | 0) >= minRow && ((i / W) | 0) < bottom) c.push(i);
    return c.length ? c[rnd(c.length)] : -1;
  };
  const clusters = 3 + Math.floor(floor / 2);
  for (let k = 0; k < clusters; k++) {
    const o = pickOre(floor);
    const size = 1 + rnd(4);
    const seed = stoneAt(1);
    if (seed < 0) break;
    t[seed] = { t: 'o', o, open: false };
    const vein = [seed];
    while (vein.length < size) {
      const cand = [];
      vein.forEach(i => orth(i).forEach(j => { if (t[j].t === 's' && ((j / W) | 0) < bottom) cand.push(j); }));
      if (!cand.length) break;
      const j = cand[rnd(cand.length)];
      t[j] = { t: 'o', o, open: false };
      vein.push(j);
    }
  }
  if (dawn) {
    const n = floor >= 4 ? 2 : 1;
    for (let k = 0; k < n; k++) { const i = stoneAt(2); if (i >= 0) t[i] = { t: 'o', o: 'moon', open: false }; }
  }
  if (floor < MAX_FLOOR) { const i = stoneAt(3); if (i >= 0) t[i].t = 'x'; }
  return { floor, tiles: t };
}
function canDig(i) {
  const tl = S.mine.tiles[i];
  if (tl.open || tl.t === 'h') return false;
  if (i < W) return true;
  return orth(i).some(j => S.mine.tiles[j].open);
}
function hint(i) {
  return around(i).filter(j => S.mine.tiles[j].t === 'o' && !S.mine.tiles[j].open).length;
}
function enterMine(floor) {
  S.mine = genBoard(floor, phaseIndex() === 3);
  S.screen = 'mine';
  closeModal();
  save(); render();
  if (floor === MAX_FLOOR) toast('🪨 더 아래는 단단한 바위');
}
let lastDug = [];
function dig(i) {
  const tl = S.mine.tiles[i];
  if (tl.t === 'h') { toast('🪨 단단한 바위라 곡괭이 강화 필요'); return; }
  if (tl.open) { if (tl.t === 'x') descend(); return; }
  if (!canDig(i)) { toast('위쪽에서 이어진 칸부터 캐기'); return; }
  lastDug = [i];
  if (tl.t === 'o') {
    const o = tl.o, vein = [i], seen = new Set([i]);
    for (let k = 0; k < vein.length; k++) {
      orth(vein[k]).forEach(j => {
        const q = S.mine.tiles[j];
        if (!seen.has(j) && q.t === 'o' && q.o === o && !q.open) { seen.add(j); vein.push(j); }
      });
    }
    const n = vein.length;
    const bonus = n >= 3 ? n - 2 : 0;
    vein.forEach(j => { S.mine.tiles[j] = { t: 's', open: true }; });
    lastDug = vein;
    addItem(o, n + bonus);
    toast(`<span class="ore ${o}"></span> ${ORES[o].name} +${n + bonus}` + (bonus ? ` (광맥 ${n}칸)` : ''));
  } else {
    tl.open = true;
    if (tl.t === 'x') toast('🪜 계단 발견');
  }
  if (spend(DIG_COST)) { save(); render(); }
}
function descend() {
  const f = S.mine.floor + 1;
  if (f > MAX_FLOOR) return;
  S.deepest = Math.max(S.deepest, f);
  enterMine(f);
  toast(`⬇️ ${f}층`);
}
function leaveMine() {
  S.mine = null; S.screen = 'village';
  save(); render();
}

/* ===== 마을 ===== */
function totalOres() { return ORE_ORDER.reduce((a, o) => a + (S.inv[o] || 0), 0); }
function sell(o, n) {
  n = Math.min(n, S.inv[o] || 0);
  if (n <= 0) return;
  S.inv[o] -= n;
  S.gold += ORES[o].price * n;
  toast(`🪙+${ORES[o].price * n}`);
  save(); render(); openMerchant();
}
function sellAll() {
  let g = 0;
  ORE_ORDER.forEach(o => { const n = S.inv[o] || 0; g += n * ORES[o].price; S.inv[o] = 0; });
  if (!g) return;
  S.gold += g;
  toast(`🪙+${g}`);
  save(); render(); openMerchant();
}
function openMerchant() {
  const rows = ORE_ORDER.filter(o => S.inv[o]).map(o => {
    const n = S.inv[o], p = ORES[o].price;
    return `<div class="sell"><span class="nm"><span class="ore ${o}"></span>${ORES[o].name} <small>×${n}</small></span>
      <button class="btn" data-act="sell" data-o="${o}" data-n="1">🪙${p}</button>
      <button class="btn" data-act="sell" data-o="${o}" data-n="${n}">🪙${p * n}</button></div>`;
  }).join('');
  const total = ORE_ORDER.reduce((a, o) => a + (S.inv[o] || 0) * ORES[o].price, 0);
  modal({
    title: '🧳 떠돌이 상인',
    body: `<p>광석이면 무엇이든 사 감</p>${rows || '<p class="empty">팔 것 없음</p>'}<p class="note">왼쪽은 1개, 오른쪽은 전부</p>`,
    buttons: [
      { label: `전부 🪙${total}`, act: 'sellAll', primary: true, disabled: !total },
      { label: '닫기', act: 'close' },
    ],
  });
}
function openChief() {
  if (!S.introSeen) { showIntro(0); return; }
  let line;
  if (S.gold >= GOAL.cost) line = '대장간 복구 비용은 모였고, 이제 대장장이가 돌아오기를 기다리는 중';
  else if (S.chiefDay !== S.day) { line = CHIEF_TIPS[(S.day - 1) % CHIEF_TIPS.length]; S.chiefDay = S.day; save(); }
  else line = `다음 복구는 대장간이고 남은 돈은 🪙${GOAL.cost - S.gold}`;
  modal({ title: '👴 촌장', body: `<p>${line}</p>`, buttons: [{ label: '닫기', act: 'close' }] });
}
function showIntro(k) {
  const last = k === INTRO.length - 1;
  modal({
    title: '👴 촌장',
    body: `<p>${INTRO[k]}</p><p class="note">${k + 1}/${INTRO.length}</p>`,
    buttons: [{ label: last ? '시작' : '다음', act: last ? 'introDone' : 'intro', arg: k + 1, primary: true }],
  });
}
function openHouse() {
  const late = phaseIndex() === 3;
  modal({
    title: '🏠 낡은 집',
    body: `<p>자고 나면 ${S.day + 1}일차 아침</p>` + (late ? '<p class="note">새벽이라 다음 날 기력이 조금 덜 참</p>' : ''),
    buttons: [
      { label: '처음부터', act: 'resetAsk' },
      { label: '자기', act: 'sleep', primary: true },
    ],
  });
}
function openEntrance() {
  const f = [];
  for (let i = 1; i <= S.deepest; i++) f.push(`<button class="btn" data-act="enter" data-arg="${i}">${i}층</button>`);
  modal({
    title: '⛏️ 광산 입구',
    body: `<p>내려갈 층 고르기</p><div class="floors">${f.join('')}</div><p class="note">한 칸 캘 때마다 ⚡${DIG_COST}</p>`,
    buttons: [{ label: '닫기', act: 'close' }],
  });
}
function openRuin(id) {
  const r = RUINS.find(x => x.id === id);
  const isGoal = id === GOAL.id;
  modal({
    title: `${r.icon} ${r.name}`,
    body: `<p>${r.sign}</p>` + (isGoal ? '<p class="note">다음 복구 목표이고 복구는 준비 중</p>' : ''),
    buttons: isGoal
      ? [{ label: `🪙${GOAL.cost}`, act: 'none', disabled: true }, { label: '닫기', act: 'close' }]
      : [{ label: '닫기', act: 'close' }],
  });
}

/* ===== 그리기 ===== */
function renderHud() {
  const p = PHASES[phaseIndex()], u = untilNext();
  const pct = S.energy / S.max * 100;
  const marks = PHASES.slice(1).map(ph => (S.dayStart - S.max * ph.at / 100) / S.max * 100)
    .filter(x => x > 0).map(x => `<span class="mark" style="left:${x}%"></span>`).join('');
  const g = Math.min(100, S.gold / GOAL.cost * 100);
  document.getElementById('hud').innerHTML = `
    <div class="hud-row">
      <span class="chip">📅 ${S.day}일차</span>
      <span class="chip" data-test="phase">${p.icon} ${p.name}</span>
      <span class="chip until">${u.name}까지 기력 ${u.left}</span>
      <span class="chip gold">🪙${S.gold}</span>
    </div>
    <div class="ebar"><div class="fill" style="width:${pct}%"></div>${marks}</div>
    <div class="ebar-label"><span>⚡${S.energy}/${S.max}</span><span>${S.screen === 'village' ? '마을에선 시간이 멈춤' : ''}</span></div>
    ${S.screen === 'village' ? `<div class="goal">다음 복구: ${GOAL.name} 🪙${GOAL.cost}<div class="bar"><i style="width:${g}%"></i></div></div>` : ''}`;
}
function renderVillage() {
  const inv = ORE_ORDER.filter(o => S.inv[o]).map(o =>
    `<span class="chip"><span class="ore ${o}"></span>${ORES[o].name} ${S.inv[o]}</span>`).join('');
  const ruins = RUINS.map(r => `<button class="place ruin ${r.id === GOAL.id ? 'next' : ''}" data-act="ruin" data-arg="${r.id}">
      <span class="ic">${r.icon}</span><span><b>${r.name}</b><small>${r.id === GOAL.id ? '🪙' + GOAL.cost : '팻말'}</small></span></button>`).join('');
  document.getElementById('screen').innerHTML = `
    <h2>마을</h2>
    <div class="places">
      <button class="place" data-act="entrance"><span class="ic">⛏️</span><span><b>광산</b><small>${S.deepest}층까지</small></span></button>
      <button class="place" data-act="merchant"><span class="ic">🧳</span><span><b>떠돌이 상인</b><small>팔기</small></span></button>
      <button class="place" data-act="chief"><span class="ic">👴</span><span><b>촌장</b><small>${S.introSeen ? '이야기' : '❗'}</small></span></button>
      <button class="place" data-act="house"><span class="ic">🏠</span><span><b>낡은 집</b><small>자기</small></span></button>
    </div>
    <h2>가방</h2>
    <div class="inv">${inv || '<span class="empty">빈 가방</span>'}</div>
    <h2>무너진 곳</h2>
    <div class="places">${ruins}</div>`;
}
function renderMine() {
  const m = S.mine;
  const cells = m.tiles.map((tl, i) => {
    let cls = 'tile', txt = '';
    if (tl.t === 'h') { cls += ' hard'; txt = '🪨'; }
    else if (tl.open) {
      cls += ' open';
      if (tl.t === 'x') { cls += ' stairs'; txt = '🪜'; }
      else { const n = hint(i); if (n) { cls += ' n' + n; txt = n; } }
    } else if (canDig(i)) cls += ' can';
    if (lastDug.includes(i)) cls += ' dug';
    return `<button class="${cls}" data-act="dig" data-arg="${i}" aria-label="칸 ${i + 1}">${txt}</button>`;
  }).join('');
  const stairsOpen = m.tiles.some(tl => tl.t === 'x' && tl.open);
  const got = ORE_ORDER.filter(o => S.today[o]).map(o =>
    `<span class="chip"><span class="ore ${o}"></span>${S.today[o]}</span>`).join('');
  document.getElementById('screen').innerHTML = `
    <div class="minebar">
      <button class="btn" data-act="leave">🏘️ 마을로</button>
      <b>광산 ${m.floor}층</b>
      ${m.floor < MAX_FLOOR ? `<button class="btn right ${stairsOpen ? 'primary' : ''}" data-act="descend" ${stairsOpen ? '' : 'disabled'}>⬇️ ${m.floor + 1}층</button>` : ''}
    </div>
    <div class="board">${cells}</div>
    <h2>오늘 캔 것</h2>
    <div class="inv">${got || '<span class="empty">아직 없음</span>'}</div>
    <p class="legend">밝은 칸만 캘 수 있고 한 칸에 ⚡${DIG_COST}, 숫자는 주변 8칸에 남은 광석 수</p>`;
  lastDug = [];
}
function render() {
  renderHud();
  if (S.screen === 'mine' && S.mine) renderMine(); else renderVillage();
}

/* ===== 창과 알림 ===== */
function modal({ title, body, buttons }) {
  const el = document.getElementById('modal');
  const bs = buttons.map(b => `<button class="btn ${b.primary ? 'primary' : ''}" data-act="${b.act}" ${b.arg !== undefined ? `data-arg="${b.arg}"` : ''} ${b.disabled ? 'disabled' : ''}>${b.label}</button>`).join('');
  el.innerHTML = `<div class="sheet" role="dialog"><h3>${title}</h3>${body}<div class="btns">${bs}</div></div>`;
  el.hidden = false;
}
function closeModal() { const el = document.getElementById('modal'); el.hidden = true; el.innerHTML = ''; }
function toast(html) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = html;
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 2300);
}

/* ===== 입력 ===== */
const ACTS = {
  close: closeModal,
  none: () => {},
  intro: (a) => showIntro(+a),
  introDone: () => { S.introSeen = true; S.chiefDay = S.day; save(); closeModal(); render(); },
  chief: openChief,
  merchant: openMerchant,
  house: openHouse,
  entrance: openEntrance,
  ruin: (a) => openRuin(a),
  enter: (a) => enterMine(+a),
  dig: (a) => dig(+a),
  descend,
  leave: leaveMine,
  sleep: () => { closeModal(); sleep(); },
  sellAll,
  resetAsk: () => modal({ title: '처음부터', body: '<p>모든 기록 삭제</p>', buttons: [{ label: '취소', act: 'close' }, { label: '삭제', act: 'reset', primary: true }] }),
  reset: () => { S = freshState(); save(); closeModal(); render(); showIntro(0); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'sell') { sell(b.dataset.o, +b.dataset.n); return; }
  const f = ACTS[b.dataset.act];
  if (f) f(b.dataset.arg);
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ===== 시작 ===== */
S = load();
render();
if (!S.introSeen) showIntro(0);
// 테스트용 읽기 창구
window.MinerDiary = { state: () => S, hint, canDig, phaseIndex, untilNext };
</script>
</body>
</html>
