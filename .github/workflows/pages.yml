# main에 올라오면 문법 검사 후 index.html을 GitHub Pages로 배포
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 만들기와 배포를 다른 작업으로 나눔 (GitHub 공식 방식). 한 작업 안에서 올리자마자 찾으면 묶음이 아직 안 보여 배포가 자주 실패했음 (11/26)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node tools/check-syntax.js
      - name: Build site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
